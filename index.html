<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>四级词汇巧记</title>
<style>
:root{
  --wine:#800020; --wine-soft:#9a2a44; --wine-deep:#5c0016;
  --bg:#faf6f2; --surface:#ffffff; --surface2:#f3e9e4; --ink:#241318; --muted:#8a6f76; --line:#e5d5d0;
  --accent:#800020; --on-accent:#fff5f0; --ok:#2e7d4f; --chip:#f3e9e4;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#150a0e; --surface:#2e1a20; --surface2:#382128; --ink:#f3e9e4; --muted:#cdb0b6; --line:#5b3540;
    --accent:#e0576e; --on-accent:#2a0d13; --chip:#382128;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 48px}
header{padding:8px 2px 14px}
h1{font-size:24px;margin:0;letter-spacing:.5px}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s cubic-bezier(.2,.7,.3,1)}
.hint{color:var(--muted);font-size:12px;margin:10px 2px 0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.toolbar input[type=search]{flex:1 1 220px;min-width:180px;padding:10px 14px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);font-size:15px;outline:none}
.toolbar input[type=search]:focus{border-color:var(--accent)}
.toolbar select{padding:10px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);font-size:14px;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.chip{padding:7px 14px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);font-size:14px;cursor:pointer}
.chip.active{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip.ghost{color:var(--muted)}
.group{margin-top:26px;animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) both}
.group h2{font-size:15px;margin:0 2px 10px;color:var(--muted);font-weight:600}
.group h2 b{color:var(--ink)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{perspective:900px;min-height:132px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;min-height:132px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.7,.3,1.15)}
.card.flipped .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 2px 10px rgba(60,10,20,.06)}
.face.back{transform:rotateY(180deg)}
.word{font-size:21px;font-weight:700;letter-spacing:.2px}
.phon{color:var(--muted);font-size:13px;margin-top:2px}
.phon button{margin-left:6px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:99px;padding:2px 9px;font-size:13px;cursor:pointer}
.phon button.playing{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.mean{margin-top:8px;font-size:15px}
.tag{display:inline-block;font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 8px;margin-left:8px;vertical-align:2px}
.master{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:var(--muted);font-size:15px;line-height:26px;text-align:center;cursor:pointer;padding:0}
.master.on{background:var(--ok);border-color:var(--ok);color:#fff}
.flip-hint{font-size:11px;color:var(--muted);margin-top:10px}
.trick{font-size:14px}
.trick b{color:var(--accent)}
.eg{margin-top:10px;font-size:14px}
.eg i{color:var(--muted)}
.eg-zh{color:var(--muted);font-size:13px;margin-top:2px}
.src{margin-top:8px;font-size:12px;color:var(--muted);text-align:right}
.tools{display:flex;gap:10px;margin-top:34px}
.tools button{flex:1;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;cursor:pointer}
.tools button:hover{border-color:var(--accent)}
.panel{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:none}
.panel.open{display:block}
.panel h3{margin:0 0 4px;font-size:17px}
.fc-word{font-size:30px;font-weight:700;text-align:center;margin:18px 0 4px;cursor:pointer}
.fc-phon{text-align:center;color:var(--muted);font-size:14px}
.fc-mean{text-align:center;font-size:17px;margin:16px 0;min-height:26px}
.fc-btns{display:flex;gap:10px;justify-content:center;margin-top:14px}
.fc-btns button{padding:10px 20px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-size:15px;cursor:pointer}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin-top:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--ink);font-size:15px;cursor:pointer}
.opt.right{border-color:var(--ok);background:rgba(46,125,79,.12)}
.opt.wrong{border-color:var(--wine);background:rgba(128,0,32,.1)}
.quiz-meta{color:var(--muted);font-size:13px;margin-top:12px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.quote{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.q-label{font-size:11px;color:var(--accent);letter-spacing:1px;display:block;margin-bottom:4px}
.tagline{color:var(--muted);font-size:13px;margin-top:2px}
.daily{margin:14px 0 4px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:14px;padding:14px 16px}
.daily .d-label{font-size:11px;color:var(--accent);letter-spacing:1px}
.daily .d-en{font-size:17px;font-weight:600;margin-top:4px}
.daily .d-zh{color:var(--muted);font-size:14px;margin-top:2px}
.daily .d-src{text-align:right;font-size:12px;color:var(--muted);margin-top:6px}
footer{margin-top:40px;color:var(--muted);font-size:12px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>四级词汇<span>巧记</span></h1>
  <div class="tagline">Winter is coming. 凛冬将至。——《权力的游戏》</div>
  <div class="sub" id="dayLine"></div>
  <div class="bar"><i id="progBar" style="width:0%"></i></div>
  <div class="sub" id="progLine"></div>
  <p class="hint">点卡片翻转</p>
</header>
<section class="daily" id="dailyLine"></section>
<div class="toolbar">
  <input type="search" id="search" placeholder="搜单词、中文" autocomplete="off">
  <select id="daySel" aria-label="选择日期"></select>
</div>
<div class="chips" id="chips"></div>
<main id="grid"></main>
<div class="tools">
  <button id="fcOpen">背单词</button>
  <button id="quizOpen">小测验</button>
</div>
<section class="panel" id="fcPanel">
  <h3>背单词</h3>
  <div class="fc-word" id="fcWord"></div>
  <div class="fc-phon" id="fcPhon"></div>
  <div class="fc-mean" id="fcMean"></div>
  <div class="fc-btns">
    <button id="fcDont">不认识</button>
    <button id="fcKnow">认识</button>
    <button id="fcNext">下一个</button>
  </div>
</section>
<section class="panel" id="quizPanel">
  <h3>小测验</h3>
  <div id="quizBody"></div>
</section>
<footer>四级词汇巧记 · 每天 40 个 · 笔试 12 月 12 日</footer>
</div>
<script>
const WORDS=[["fall","fɔːl","v.","落下；秋天","confuse","fall（落下）vs fail（失败）：fail 多了一个 i，像一个人跌倒后说“我（i）失败了”。","Leaves fall in autumn.","秋天树叶飘落。",""],["shake","ʃeɪk","v.","摇动；握手","assoc","甘地说：轻轻摇一摇，就能摇动世界","In a gentle way, you can shake the world.","以温和的方式，你也可以撼动世界。","甘地"],["sorry","ˈsɑːri","adj.","抱歉的；难过的","sound","谐音“骚瑞”→ 说“骚瑞”就是 sorry","I'm sorry I'm late. The bus was stuck in traffic.","对不起我迟到了，公交车堵在路上了。",""],["vote","vəʊt","v.","投票；n. 选票","assoc","vote 的 v 像一个打勾的手势，投票就是在选票上打勾。","Every citizen has the right to vote.","每个公民都有投票权。",""],["village","ˈvɪlɪdʒ","n.","村庄；村子","assoc","想象 villa（别墅）+ age：一排排小别墅住久了，就成了一个村子 village。","My grandmother lives in a small village.","我奶奶住在一个小村子里。",""],["hopeful","ˈhəʊpfəl","adj.","有希望的","root","hope（希望）+ -ful = 充满希望的","We are hopeful that the new railway will bring more visitors to the town.","我们希望新铁路能给这个小镇带来更多游客。",""],["wound","wuːnd","n.","伤口；v. 使受伤","confuse","wound 作名词“伤口”读 /wuːnd/，作 wind 的过去式读 /waʊnd/，拼写相同读音不同。","He cleaned the wound on his knee.","他清理了膝盖上的伤口。",""],["goal","ɡoʊl","n.","目标","sound","谐音“够”：目标够得着才叫 goal。","Set a goal and work hard for it.","定一个目标并为之努力。",""],["quality","ˈkwɑːləti","n.","质量；品质","assoc","quality 里的 qual 像“夸”：质量好才值得夸。","The quality of this product is very good.","这款产品的质量非常好。",""],["tidy","ˈtaɪdi","adj.","整洁的","assoc","tidy 的房间看着舒服，心情也 tidy","Keep your desk tidy.","保持你的书桌整洁。",""],["inevitable","ɪˈnevɪtəbəl","adj.","不可避免的；必然发生的","assoc","in-（不）+ evit（避免）+ -able：不可避免的。","I am inevitable.","我就是天命。","《复仇者联盟4：终局之战》"],["export","ɪkˈspɔːt","v.","出口","root","ex-（出）+ port（搬运）→ 搬出去 → 出口；和 import 是一对。","China exports electric cars to Europe.","中国向欧洲出口电动车。",""],["magic","ˈmædʒɪk","n./adj.","魔法；神奇的","assoc","magic 里的 mag 像魔术师的帽子，变出兔子。","The magician performed a magic trick with cards.","魔术师表演了一个纸牌魔术。",""],["length","leŋθ","n.","长度","root","long（长）+ -th（名词后缀）= length，宽是 width，深是 depth。","The Great Wall is about 21,000 kilometers in length.","长城全长约 21000 公里。",""],["quantity","ˈkwɑːntəti","n.","数量","confuse","quantity 是“数量”，quality 是“质量”，一字之差，天壤之别。","We need a large quantity of paper.","我们需要大量的纸。",""],["media","ˈmiːdiə","n.","媒体","root","medi- 是“中间”，media 是介于事件和大众“中间”的媒体。","Social media changes the way we get news.","社交媒体改变了我们获取新闻的方式。",""],["park","pɑːrk","n./v.","公园；停车","assoc","park 既是“公园”，也是“停车”：把车停在公园边。","We walked in the park after dinner.","晚饭后我们在公园里散步。",""],["foot","fʊt","n.","脚；英尺","sound","谐音“福特”：福特汽车的轮胎像一只大脚，foot 是脚；也是英尺。","He hurt his foot.","他伤了脚。",""],["powerful","ˈpaʊəfəl","adj.","强大的","root","power（力量）+ -ful = 充满力量的","The new electric car has a powerful engine and can run 600 kilometres on one charge.","这款新电动车动力强劲，充一次电能跑 600 公里。",""],["august","ˈɔːɡəst","n.","八月","sound","谐音“熬过死它”：August（八月）最热，熬过它就凉快了","August is the hottest month of the year in most parts of China.","八月是中国大部分地区一年中最热的月份。",""],["sleep","sliːp","v./n.","睡觉","root","sleep 源自古英语 slǣpan，睡觉","A good night's sleep helps your memory.","一夜好眠有助于记忆。",""],["satisfy","ˈsætɪsfaɪ","v.","使满意","root","satis-（足够）+ -fy（使）→ 使足够 → 满足","The result satisfied everyone in the room.","这个结果让在场所有人都满意。",""],["basketball","ˈbɑːskɪtbɔːl","n.","篮球","assoc","basket（篮子）+ ball（球）：往篮子里投的球 → 篮球。","He likes basketball.","他喜欢篮球。",""],["sacrifice","ˈsækrɪfaɪs","n./v.","牺牲；献出","root","sacri-（神圣）+ -fice（做）→ 把神圣的东西献出去 → 牺牲","Every great achievement requires some sacrifice.","每一项伟大的成就都需要一些牺牲。",""],["airport","ˈeəpɔːt","n.","机场","assoc","联想：air（空气）+ port（港口）= 空中的港口，机场","We arrived at the airport two hours before the flight took off.","我们在航班起飞前两小时到达机场。",""],["successful","səkˈsesfəl","adj.","成功的","root","success（成功）+ -ful = 成功的","The successful launch of the satellite was watched by millions of people online.","数百万人在线观看了卫星的成功发射。",""],["empty","ˈempti","adj.","空的","assoc","empty 中间的 'm' 像一张空空的碗，什么都没有，就是空的。","The box is empty.","盒子是空的。",""],["finally","ˈfaɪnəli","adv.","最后；终于","sound","final（最后的）+ -ly = 到最后，终于","After three years of hard work, she finally passed the driving test.","经过三年的努力，她终于通过了驾照考试。",""],["easy","ˈiːzi","adj.","容易的","sound","谐音“衣食”：衣食无忧的日子，真 easy（容易）！","This question is easy.","这道题很简单。",""],["unnecessary","ʌnˈnesəsəri","adj.","不必要的","root","un-（不）+ necessary（必要的）= 没必要，多余的","Turning off the lights is a simple way to avoid unnecessary waste of electricity.","关灯是避免不必要浪费电的简单办法。",""],["whole","həʊl","adj.","全部的；整个的","confuse","别和 hole（洞）搞混：whole 是“整个的”，hole 是“洞”，发音一样，whole 多了个 w，像把洞整个包住。","He spent the whole day reading.","他花了整整一天看书。",""],["design","dɪˈzaɪn","n./v.","设计","root","de-（标出）+ sign（记号）= 画出记号 → 设计。","Good design makes a difficult tool feel easy.","好的设计能让难用的工具变简单。",""],["visit","ˈvɪzɪt","v.","参观；访问；n. 访问","root","vis-（看）+ -it：去“看一看”就是 visit；同根 vision（视力）、video（视频）。","We plan to visit the museum this weekend.","我们计划这个周末去参观博物馆。",""],["elect","ɪˈlekt","v.","选举","root","e-（出）+ lect（选）→ 选出来 → 选举。","They elected him president.","他们选他当总统。",""],["fresh","freʃ","adj.","新鲜的","sound","谐音“弗雷什”：弗雷什的空气真新鲜，fresh 就是新鲜的。","Fresh air is good for health.","新鲜空气有益健康。",""],["captain","ˈkæptɪn","n.","船长；队长","assoc","cap（帽子）+ tain：戴着帽子管事的人就是船长。","The captain told the crew to stay calm in the storm.","船长告诉船员在风暴中保持镇静。",""],["feel","fiːl","v.","感觉","assoc","feel 里有 eel（鳗鱼）：摸鳗鱼滑滑的感觉，就是 feel。","I feel happy today.","我今天感觉很开心。",""],["tall","tɔːl","adj.","高的","sound","谐音“套”→ 长得高，像套了个高帽","The tall building has 30 floors.","这栋高楼有 30 层。",""],["vary","ˈveəri","v.","变化；不同","confuse","别和 very（非常）搞混：vary 是动词“变化”，very 是副词“非常”，只差一个字母的位置。","Prices vary from shop to shop.","价格因店而异。",""],["candle","ˈkændl","n.","蜡烛","sound","谐音“看的”：蜡烛是用来看得见的。","Light a candle.","点一支蜡烛。",""],["various","ˈveəriəs","adj.","各种各样的","root","vari-（变化）+ -ous：变来变去 → 各种各样的；同根 vary（变化）、variety（多样）。","The shop sells various kinds of snacks.","这家店卖各种各样的小吃。",""],["necessary","ˈnesəseri","adj.","必要的","root","ne-（不）+ cess（走开）= 走不开的，就是“必要的”。","It is necessary to study hard for CET-4.","为四级努力学习是必要的。",""],["wild","waɪld","adj.","野生的；野的","assoc","wild 里的 i 像一匹野马在草原上狂奔——wild 就是野的。","Wild animals live in the forest.","野生动物生活在森林里。",""],["save","seɪv","v.","拯救；节省","confuse","save（拯救/节省）vs safe（安全的）—— save 是动作，safe 是状态","Saving a little every month adds up fast.","每月存一点，积少成多。",""],["card","kɑːrd","n.","卡片；卡","sound","谐音“卡的”——卡片卡在钱包里","He sent his teacher a thank-you card on Teachers' Day.","教师节那天，他给老师寄了一张感谢卡。",""],["pack","pæk","v./n.","打包；包裹","sound","谐音“派克”：把东西打包好派克送走。","She packed her clothes for the trip.","她为旅行打包了衣服。",""],["shift","ʃɪft","v.","转移；换班","assoc","开车换挡就是 shift gears，换个挡继续走","The company shifted its focus to electric cars.","公司把重心转向了电动车。",""],["busy","ˈbɪzi","adj.","忙碌的","sound","谐音“比子”：busy（忙碌的）比子还忙","The bees are busy in the garden all summer.","蜜蜂整个夏天都在花园里忙碌。",""],["driver","ˈdraɪvə(r)","n.","司机","assoc","联想：drive（开车）+ -er = 开车的人，司机","The driver of the bus waited for the old woman to sit down.","公交车司机等老奶奶坐下才开车。",""],["establish","ɪˈstæblɪʃ","v.","建立；设立","root","e- + stable（稳定的）→ 使稳定下来 → 建立。","The school was established in 2000.","这所学校建于 2000 年。",""],["stubborn","ˈstʌbən","adj.","固执的","sound","谐音“死大笨”：死犟死犟的大笨蛋 → 固执。","He is too stubborn to say sorry.","他固执得不肯道歉。",""],["vacation","vəˈkeɪʃən","n.","假期；休假","sound","谐音“为开森”：放假就是为了开心——vacation 是假期。","We are planning a vacation to the beach this summer.","我们计划今年夏天去海边度假。",""],["accompany","əˈkʌmpəni","v.","陪伴","root","ac-（共同）+ com-（一起）+ pan-（面包）= 一起分面包的人→陪伴。","A small robot dog now accompanies many elderly people who live alone.","一只小机器狗如今陪伴着许多独居老人。",""],["sail","seɪl","v./n.","航行；帆","sound","谐音“赛尔”→ 扬帆出赛，sail 出海","The ship will sail at dawn.","船将在黎明时起航。",""],["green","ɡriːn","adj.","绿色的","assoc","green 的 'ee' 像两片绿叶，绿色就是 green。","Green is the colour of spring.","绿色是春天的颜色。",""],["happen","ˈhæpən","v.","发生","root","hap（运气）+ pen → 碰巧发生 → 发生。","What happened to you yesterday?","你昨天出什么事了？",""],["dark","dɑːrk","adj.","黑暗的；深色的","assoc","联想停电的夜晚，屋里一片 dark，只有手机的光","It gets dark early in winter, so we leave school before five.","冬天天黑得早，所以我们五点前就离校了。",""],["progress","ˈprəʊɡres","n.","进步","root","pro-（向前）+ gress（走）→ 向前走 → 进步。","Progress is impossible without change.","没有改变，就没有进步。",  in the pan before you add the eggs.","先把黄油在锅里化开，再打鸡蛋进去。",""],["eat","iːt","v.","吃","assoc","eat = e + at：在（at）餐桌前吃东西。","We eat rice every day.","我们每天都吃米饭。",""],["tear","ter","v.","撕","confuse","tear 两个读音两种意思：/ter/ 是撕开，/tɪr/ 是眼泪","Be careful not to tear the paper.","小心别把纸撕破了。",""],["account","əˈkaʊnt","n.","账户；账目","assoc","a + count（数）：数出来的钱就是账，a + count = account。","Please check your account balance before you pay.","付款前请先查一下账户余额。",""],["preview","ˈpriːvjuː","n.","预习；预告","root","pre-（提前）+ view（看）= 提前看，预习功课、预告片都是它","The preview of the new film made everyone in the cinema want to watch it.","这部新片的预告让影院里的每个人都想看它。",""],["right","raɪt","adj.","正确的；右边的","confuse","right 是‘对的、右边的’；别和 write（写）混，right 没有 w","Turn right at the traffic lights and you will see the library.","在红绿灯处右转，你就会看到图书馆。",""],["hard","hɑːrd","adj.","困难的；硬的","confuse","hard（困难的；努力地）vs hardly（几乎不）：hardly 不是 hard 的副词，别混。","English is hard but interesting.","英语难但有趣。",""],["pilot","ˈpaɪlət","n.","飞行员","assoc","联想：pilot 像‘拍了它’，飞行员拍了拍飞机起飞","The pilot flew the plane through the clouds to the sunny city.","飞行员驾机穿过云层，飞往阳光明媚的城市。",""],["search","sɜːrtʃ","v.","搜索；搜查","assoc","search 像侦探兜圈子找线索，一圈一圈地找","Police searched the building for evidence.","警方搜查了大楼寻找证据。",""],["secure","sɪˈkjʊr","adj.","安全的","root","se-（无）+ cur-（担心）→ 无担忧 → 安全","Make sure the door is secure before you sleep.","睡觉前确保门锁好。",""],["slim","slɪm","adj.","苗条的；微小的","root","slim 源自荷兰语 slim，本义“狡猾”，后指“苗条”","There is only a slim chance of rain today.","今天下雨的可能性很小。",""],["afternoon","ˌɑːftəˈnuːn","n.","下午","root","after-（之后）+ noon（中午）= 中午之后，下午","We have a football match on Friday afternoon.","我们周五下午有一场足球赛。",""],["light","laɪt","n./adj.","光；轻的","assoc","light 一词两义：light 是“光”，也是“轻的”，羽毛和阳光都轻。","The room was full of warm light.","房间里充满了温暖的光。",""],["wide","waɪd","adj.","宽的；宽阔的","assoc","wide 里的 i 像一条宽阔的大道向两边展开——wide 就是宽的。","The river is very wide here.","这条河在这里非常宽。",""],["change","tʃeɪndʒ","v./n.","改变","root","camb-（交换）= 换来换去 → 改变。","Small changes in habit can change a whole term.","习惯上的小改变，能改变整个学期。",""],["next","nekst","adj./adv.","下一个的","assoc","next 里的 ex 是“下一个”：next week 下周，next to 在旁边。","See you next week.","下周见。",""],["which","wɪtʃ","pron.","哪一个","root","wh- 疑问词家族：which 是“哪一个”，在几个里面选就用 which。","Which one do you like, the red or the blue?","红色和蓝色，你喜欢哪一个？",""],["soup","suːp","n.","汤","sound","谐音“苏普”→ 喝一碗热汤，苏苏服服","Mum made tomato soup for dinner.","妈妈晚餐做了番茄汤。",""],["meaning","ˈmiːnɪŋ","n.","意义；意思","root","mean（意思）+ -ing = meaning，生命的意义是 the meaning of life。","The meaning of this poem is hard to explain.","这首诗的含义很难解释。",""],["somebody","ˈsʌmbədi","pron.","某人","root","some（某）+ body（人）= 某人","Somebody left an umbrella in the classroom.","有人把伞落在教室里了。",""],["temperature","ˈtemprətʃər","n.","温度","root","temper-（调和/适度）+ -ature → 冷热适中的程度 → 温度","The temperature dropped below zero last night.","昨晚气温降到了零度以下。",""],["especially","ɪˈspeʃəli","adv.","尤其；特别","confuse","especially（尤其）vs specially（专门地）：specially 是 special + ly，强调专门、特意。","I like fruit, especially apples.","我喜欢水果，尤其是苹果。",""],["piece","piːs","n.","一块；一片","confuse","piece 是‘一块’，piece 里有 pie（馅饼），切一块馅饼；别和 peace（和平）混","Would you like another piece of cake after dinner?","晚饭后你想再来一块蛋糕吗？",""],["associate","əˈsoʊʃieɪt","v.","联系；交往","root","as-（朝向）+ soci-（伙伴）= 结为伙伴→联系起来。","Most people associate the smell of rain with their childhood summers.","多数人闻到雨味，就会联想起童年的夏天。",""],["technology","tekˈnɑːlədʒi","n.","技术；科技","root","techno-（技术）+ -logy（学科）→ 技术之学","New technology changes our lives every day.","新技术每天都在改变我们的生活。",""],["brave","breɪv","adj.","勇敢的","sound","谐音“不累”：勇敢的人从不喊累。","Being brave doesn't mean you go looking for trouble.","勇敢并不意味着到处找麻烦。","《狮子王》"],["half","hæf","n./adj.","一半","confuse","half（n./adj. 一半）vs halve（v. 对半分）：发音一样，词性不同。","Half of the students are girls.","一半学生是女生。",""],["never","ˈnevər","adv.","从不；永不","assoc","never 里藏着 ever：never = not ever，永远不。","Never give up your dream.","永远不要放弃你的梦想。",""],["thousand","ˈθaʊzənd","num.","一千","assoc","千里之行，始于足下","千里之行，始于足下。","A journey of a thousand miles begins with a single step.","《道德经》"],["daily","ˈdeɪli","adj./adv.","每日的","root","day（天）+ -ly（……的）= 每一天的。","A daily walk of twenty minutes clears the mind.","每天散步二十分钟能让头脑清醒。",""],["unique","juːˈniːk","adj.","独特的","root","uni-（一）+ que → 独一无二 → 独特的。","Every snowflake is unique.","每片雪花都是独一无二的。",""],["assist","əˈsɪst","v.","帮助","root","as-（旁边）+ sist（站）→ 站在旁边 → 协助、帮助。","The nurse assisted the doctor.","护士协助医生。",""],["sharp","ʃɑːrp","adj.","锋利的；敏锐的","assoc","刀刃 sharp，脑子 sharp，都是“快”","A sharp mind learns fast.","敏锐的头脑学得快。",""],["benefit","ˈbenɪfɪt","n./v.","益处；受益","root","bene-（好）+ fit（做）= 做好事 → 得到益处。","Regular exercise brings more benefits than any medicine.","规律运动带来的好处比任何药都多。",""],["under","ˈʌndə","prep.","在……下面；低于","root","under- 是“在下面”的意思，underground（地下的）= under + ground，understand 是“站在下面”去理解。","The cat is sleeping under the table.","猫正在桌子底下睡觉。",""],["career","kəˈrɪr","n.","职业；生涯","assoc","career 里藏着 car（车）：职业就是你人生开的那辆车，开向哪里由你定。","She wants a career in medicine, not just a job.","她想要一份医学事业，而不只是一份工作。",""],["medicine","ˈmedɪsɪn","n.","药；医学","root","medic-（医疗）+ -ine：治病的东西就是 medicine。","Take the medicine three times a day.","这药每天吃三次。",""],["begin","bɪˈɡɪn","v.","开始","sound","谐音“笔根”：begin（开始）像笔根落纸，第一笔就是开始","Well begun is half done, so start your revision today, not tomorrow.","良好的开端是成功的一半，所以今天就开始复习，别等明天。",""],["century","ˈsentʃəri","n.","世纪","root","cent-（一百）= 一个世纪一百年，cent 藏在里面。","The Great Wall has stood for more than twenty centuries.","长城已经矗立了二十多个世纪。",""],["great","ɡreɪt","adj.","伟大的","sound","谐音“格瑞特”：记住这个音，great 就是伟大的。","He is a great scientist.","他是一位伟大的科学家。",""],["hour","ˈaʊər","n.","小时","confuse","hour（小时）vs our（我们的）同音。","An hour a day is enough.","每天一小时就够了。",""],["classroom","ˈklɑːsruːm","n.","教室","assoc","class（班级）+ room（房间）：班级的房间 → 教室。","a big classroom","一间大教室",""],["call","kɔːl","v./n.","称呼；打电话；电话","sound","谐音“靠”——打电话靠吼，隔壁都听见了","Please call me if the train is late.","如果火车晚点，请给我打电话。",""],["false","fɔːls","adj.","错误的","root","fals（欺骗）+ e → 假的；错误的。","That is a false report.","那是一则假消息。",""],["father","ˈfɑːðər","n.","父亲","assoc","father 里有个 fat（胖）：爸爸的肚子总是胖胖的。","My father is a teacher.","我爸爸是一名老师。",""],["metal","ˈmetl","n.","金属","sound","谐音“卖套”：卖铁套的人卖的是 metal（金属）。","This bridge is made of metal.","这座桥是金属做的。",""],["ease","iːz","n./v.","容易；缓和","confuse","ease 是名词/动词“缓和”，easy 是形容词“容易的”，词性不同别混。","The medicine eased his pain.","这药缓解了他的疼痛。",""],["adventure","ədˈventʃər","n.","冒险；奇遇","root","ad-（去）+ venture（冒险）→ 去冒险 = 奇遇","The movie tells the adventure of a boy who sails across the sea alone.","这部电影讲述了一个男孩独自驾船横渡大海的冒险故事。",""],["sunrise","ˈsʌnraɪz","n.","日出","assoc","sun（太阳）+ rise（升起）：太阳升起 → 日出。","Watch the sunrise.","看日出。",""],["film","fɪlm","n.","电影","sound","谐音“菲尔姆”：菲尔姆一格一格放，就是电影 film。","We watched a film last night.","我们昨晚看了一部电影。",""],["absorb","əbˈsɔːrb","v.","吸收","root","ab-（向内）+ sorb（吸）= 吸进来 → 吸收。","Electric cars now absorb most of the growth in China's auto market.","电动车如今吸收了中国汽车市场的大部分增量。",""],["gold","ɡoʊld","n.","金；金色的","assoc","gold 的 'o' 像一枚金币，金子就是 gold。","Gold is more expensive than silver.","金子比银子贵。",""],["hero","ˈhɪroʊ","n.","英雄","sound","谐音“希罗”：希罗胸前挂着勋章，hero 就是英雄。","He is a hero in our eyes.","他是我们眼中的英雄。",""],["help","help","v./n.","帮助","sound","谐音“海普”：海普伸手来帮你，help 就是帮助。","Can you help me?","你能帮我吗？",""],["bought","bɔːt","v.","买（buy 的过去式）","sound","谐音“包它”：bought（买了）像把东西包起来带走","She bought a new dress for the party last week.","她上周为聚会买了一条新裙子。",""],["earn","ɜːrn","v.","赚得；获得","confuse","和 yearn（渴望）只差一个 y：yearn 是心里想要，earn 是实实在在赚到手。","He earns a good salary as a teacher.","他当老师挣得不少。",""],["raise","reɪz","v.","举起；提高","confuse","raise 是“举起、提高”，rise 是“上升”，raise 及物、rise 不及物。","Please raise your hand if you have a question.","有问题请举手。",""],["fish","fɪʃ","n.","鱼","sound","谐音“费什”：费什在水里游，fish 就是鱼。","There are many fish in the lake.","湖里有很多鱼。",""],["rise","raɪz","v.","上升；升起","confuse","rise 是不及物动词，自己升：the sun rises（太阳升起）；别和 raise（举起）混","The sun rises in the east and sets in the west.","太阳从东方升起，从西方落下。",""],["cook","kʊk","v./n.", ign the contract.","签合同前，先读一读底下那条小字条款。",""],["exact","ɪɡˈzækt","adj.","确切的","root","ex-（出）+ act（做）→ 做得恰到好处 → 确切的。","What is the exact time?","准确的时间是几点？",""],["sound","saʊnd","n.","声音","root","son-（声音）→ sound","The sound of rain helps me fall asleep.","雨声能帮助我入睡。",""],["bear","beər","n./v.","熊；忍受；承担","sound","谐音“贝尔”——熊贝尔既能忍受寒冷，也能承担重量","I can't bear the noise from the building site next door.","我忍受不了隔壁工地的噪音。",""],["member","ˈmembər","n.","成员","root","member 让人想起 remember：记住团队的每个成员。","He is a member of the football team.","他是足球队的一员。",""],["breathe","briːð","v.","呼吸","confuse","breathe 是动词‘呼吸’，breathe 比 breath 多个 e，像一口气呼出来；别和 breath（名词）混","Just breathe in slowly and breathe out slowly when you feel nervous.","紧张时慢慢吸气、慢慢呼气。",""],["opposite","ˈɑːpəzɪt","adj./n.","相反的；对面","root","oppo-（对着）+ site（位置）= 站在对面的，就是 opposite。","The bank is opposite the school.","银行在学校对面。",""],["wise","waɪz","adj.","明智的；聪明的","root","wis- 是“知道”的词根（同根 wisdom 智慧），wise = 知道得多 → 明智的。","It is wise to save money for the future.","为将来存钱是明智的。",""],["entire","ɪnˈtaɪər","adj.","整个的","root","en- + tire（轮胎）→ 整个轮胎，一块都没缺 → 整个的。","The entire class passed the exam.","全班都通过了考试。",""],["mad","mæd","adj.","疯狂的；生气的","sound","谐音“卖的”：气得发疯的人，什么都“卖的”不管了。","He was mad at his friend for being late.","他因为朋友迟到而生气。",""],["very","ˈveri","adv.","非常；很","assoc","very 像一个人竖起大拇指说“very good”，very 就是“非常”的加强语气。","The movie was very interesting.","这部电影非常有意思。",""],["harm","hɑːrm","n./v.","伤害","sound","谐音“哈姆”：哈姆受了伤，harm 就是伤害。","Smoking does harm to your health.","吸烟有害健康。",""],["admire","ədˈmaɪə","v.","钦佩；羡慕","root","ad-（向）+ mir（看）→ 朝着看 → 钦佩；mirror（镜子）也是这个词根。","I admire her courage in facing the challenge alone.","我钦佩她独自面对挑战的勇气。",""],["almost","ˈɔːlməʊst","adv.","几乎","sound","谐音“袄摸死它”：almost（几乎）摸到它了，就差一点","We almost missed the train because of the traffic jam.","因为堵车，我们差点错过火车。",""],["brake","breɪk","n./v.","刹车","confuse","brake（刹车）vs break（打破）：brake 中间有个 a，像刹车踩下的踏板；break 是打破东西","The driver hit the brake when a dog ran across the road.","一只狗跑 il（尾巴）混","Grandma told us a tale about a clever fox.","奶奶给我们讲了一个关于聪明狐狸的故事。",""],["lecture","ˈlektʃər","n./v.","讲座；演讲","root","lect- 是“讲、读”的词根，lecture 就是“讲出来的课”。","The professor gave a lecture on climate change.","教授做了一场关于气候变化的讲座。",""],["stationery","ˈsteɪʃənri","n.","文具","confuse","和 stationary 一对：stationery 里有 er，像橡皮 eraser → 文具。","a stationery shop","一家文具店",""],["compliment","ˈkɒmplɪmənt","n./v.","赞美","confuse","易混 complement（补充）：compliment 是“说好话”，complement 是“补足”；compliment 里有个 i（我）→ 我说你好话，complement 像 complete（完整）→ 需要补充才完整。","She paid him a compliment on his beautiful handwriting.","她夸他的字写得漂亮。",""],["already","ɔːlˈredi","adv.","已经","sound","谐音“哦，累得”：already（已经）累得不行了","I have already finished my homework, so I can watch the film tonight.","我已经写完作业了，今晚可以看电影。",""],["thought","θɔːt","n.","想法","root","think 的过去式 thought，想法就是“想过的东西”","What are your thoughts on the new plan?","你对新计划有什么想法？",""],["date","deɪt","n./v.","日期；约会；注明日期","confuse","date（日期）vs data（数据）：date 是日子，data 是数字——约会看日子，做实验看数据","Don't forget the date of the English exam: December 12th.","别忘了英语考试的日期：12月12日。",""],["rewrite","ˌriːˈraɪt","v.","重写","root","re-（再）+ write（写）= 再写一遍，重写","The author had to rewrite the whole ending after the readers complained.","读者抱怨后，作者不得不把结尾整个重写。",""],["advance","ədˈvæns","v./n.","前进；提前","root","ad-（向前）+ vance（走）→ 向前走 = 前进","Science advances when people keep asking questions.","当人们不断提问时，科学就会进步。",""],["buy","baɪ","v.","买","sound","谐音“拜”：buy（买）像拜一拜就把东西带回家","I want to buy a ticket for the film tonight.","我想买一张今晚电影的票。",""],["would","wʊd","v.","将；愿意","confuse","别和 wood（木头）搞混：would 是“将、愿意”，wood 是木头；Would you like... 是最常用的客气问法。","Would you like a cup of tea?","你想喝杯茶吗？",""],["term","tɜːrm","n.","学期；术语","assoc","开学第一 term，新学期新开始","The new term begins in September.","新学期九月开始。",""],["coast","kəʊst","n.","海岸","confuse","coast 是‘海岸’，coast 里有 oa（像海鸥），海边有海鸥；别和 cost（花费）混","We drove along the coast and watched the waves hit the rocks.","我们沿着海岸开车，看海浪拍打岩石。",""],["capitol","ˈkæpɪtəl","n.","国会大厦","confuse","易混 capital（首都；资本）：capitol 特指国会大厦那栋楼，capital 是首都或资本；capitol 里的 -ol 像圆顶（dome）上的 o。","Visitors can tour the Capitol in Washington, D.C., on weekends.","周末游客可以参观华盛顿的国会大厦。",""],["cancer","ˈkænsər","n.","癌症","assoc","cancer 本义是“螃蟹”：癌细胞像螃蟹一样横着扩散。","Doctors say early checks help find cancer in time.","医生说早期检查有助于及时发现癌症。",""],["fix","fɪks","v.","修理；固定","assoc","fix 的 'x' 像一把扳手，修理就是 fix。","Can you fix my bike?","你能帮我修一下自行车吗？",""],["hole","hoʊl","n.","洞","confuse","hole（洞）vs whole（整个的）同音。","There is a hole in the wall.","墙上有个洞。",""],["affect","əˈfekt","v.","影响","confuse","和 effect 一对：affect 是动词（A = Action，动作），effect 是名词（E = End，结果）。","Smoking affects your health.","吸烟影响你的健康。",""],["belief","bɪˈliːf","n.","信念；信仰","confuse","别和动词 believe 搞混：belief 是名词（信念），believe 是动词（相信），f 变成 v 就是动词。","It is my belief that hard work pays off in the end.","我坚信努力最终会有回报。",""],["ship","ʃɪp","n.","船","confuse","ship（船）vs sheep（羊）—— ship 在水上跑，sheep 在草地上跑","The goods will be shipped by sea.","货物将海运发出。",""],["shower","ˈʃaʊər","n.","淋浴；阵雨","assoc","花洒落下的水像一阵小雨，shower 就是一阵水","A sudden shower caught us without an umbrella.","一场突如其来的阵雨让我们措手不及。",""],["skill","skɪl","n.","技能","sound","谐音“死磕”→ 死磕练习才能练出 skill","Speaking English well is a useful skill.","说一口流利的英语是一项有用的技能。",""],["sunglasses","ˈsʌnɡlɑːsɪz","n.","太阳镜","assoc","sun（太阳）+ glasses（眼镜）：挡太阳的眼镜 → 太阳镜。","Wear sunglasses in summer.","夏天戴太阳镜。",""],["mark","mɑːrk","n./v.","标记；分数","assoc","mark 既是“做标记”，也是考试的“分数”。","The teacher marked the important words in the book.","老师在书上标记了重要的单词。",""],["idea","aɪˈdɪə","n.","想法","sound","谐音“爱迪尔”：爱迪尔脑中灯泡一亮，idea 就是想法。","What a good idea!","多好的主意！",""],["brother","ˈbrʌðə(r)","n.","兄弟","sound","谐音“不拉的”：brother（兄弟）是不拉你后腿的人","My younger brother likes playing football after school.","我弟弟喜欢放学后踢足球。",""],["friend","frend","n.","朋友","assoc","friend 里有个 end：朋友是一辈子的，到 end 都在。","A friend in need is a friend indeed.","患难见真情。","英语谚语"],["late","leɪt","adj./adv.","迟的；晚的","sound","谐音“累特”：加班累到特别晚才回家。","The high-speed train was ten minutes late because of heavy rain.","高铁因暴雨晚点了十分钟。",""],["sign","saɪn","n.","标志","root","sign-（记号）→ 画个记号就是签名","Please sign your name at the bottom.","请在底部签上你的名字。",""],["something","ˈsʌmθɪŋ","pron.","某事；某物","root","some（某）+ thing（东西）= 某事；某物","There is something wrong with the printer; it will not start.","打印机出毛病了，怎么也启动不了。",""],["basic","ˈbeɪsɪk","adj.","基本的","root","bas-（底部）= 基础；底部决定了上面能盖多高。","Good pronunciation starts with basic sounds, not difficult words.","好的发音从基本音素开始，而不是从难词开始。",""],["dirty","ˈdɜːrti","adj.","脏的","assoc","联想雨后泥坑里的鞋，dirty","After the football match, the boys' shoes were all dirty.","足球赛后，男孩们的鞋全脏了。",""],["horse","hɔːrs","n.","马","assoc","horse 的 'or' 像马蹄声嗒嗒，马就是 horse。","He rides a horse.","他骑马。",""],["warm","wɔːm","adj.","温暖的；热情的","assoc","warm 像一杯热牛奶冒着热气，喝下去全身都暖了。","The sun is warm today.","今天阳光暖暖的。",""],["among","əˈmʌŋ","prep.","在……之中","confuse","易混 between（两者之间）：between 用于两者，among 用于三者以上；among 里藏着“一群”（a-mong），人多才用 among。","Among the blind, the one-eyed man is king.","盲人之中，独眼者为王。","英语谚语"],["match","mætʃ","n./v.","比赛；相配","assoc","match 一词多义：火柴、比赛、相配，都是“配对”的意思。","The football match starts at 8 o'clock tonight.","今晚八点足球比赛开始。",""],["path","pæθ","n.","小路；道路","sound","谐音“拍死”：小路上拍死了一只蚊子。","There is a path through the forest.","有一条小路穿过森林。",""],["partner","ˈpɑːrtnər","n.","伙伴；合作者","root","part（部分）+ -ner：分担一部分的人，就是 partner。","He is my partner in the project.","他是我这个项目的搭档。",""],["team","tiːm","n.","队；团队","assoc","一个人走得快，一群人走得远，team 力量大","Our team won the basketball match.","我们队赢了篮球比赛。",""],["degree","dɪˈɡriː","n.","程度；学位","assoc","degree 里藏着 gree（agree 里的 gree）：拿到学位，大家都同意（agree）你厉害。","She finished her degree in printing engineering this year.","她今年拿到了印刷工程的学位。",""],["usually","ˈjuːʒuəli","adv.","通常；一般","root","usual（通常的）+ -ly（副词后缀）= 通常地；-ly 是副词最常见的尾巴。","I usually take the subway to school.","我通常坐地铁去学校。",""],["amazing","əˈmeɪzɪŋ","adj.","令人惊奇的","sound","谐音“啊，妹子”——妹子看到满天烟花，直呼 amazing。","Amazing grace! how sweet the sound, that saved a wretch like me.","奇异恩典，何等甘甜，我罪人竟蒙赦免。","《奇异恩典》"],["unhappy","ʌnˈhæpi","adj.","不高兴的","root","un-（不）+ happy（开心的）= 开心反了，不高兴","He looked unhappy when he heard that his flight had been delayed again.","听说航班又延误了，他一脸不高兴。",""],["sink","sɪŋk","v.","下沉","assoc","泰坦尼克沉没，冰山面前的巨轮也 sink","The stone sank to the bottom of the lake.","石头沉到了湖底。",""],["male","meɪl","adj.","男性的","confuse","male 是‘男性的’，male 里有 al（像‘哦了’），男的哦了一声；别和 mail（邮件）混","The male lion is bigger than the female lion.","雄狮比雌狮大。",""],["argue","ˈɑːrɡjuː","v.","争论","assoc","想象：两个人争得面红耳赤，拍着桌子各不相让——这就是 argue。","They argued for an hour about whether to travel by train or by plane.","他们为坐火车还是坐飞机争论了一个小时。",""],["narrow","ˈnæroʊ","adj.","狭窄的","sound","谐音“奶肉”：窄巷子里卖奶和肉。","The street is too narrow for cars.","这条街太窄，汽车过不去。",""],["tiny","ˈtaɪni","adj.","微小的","root","tiny ← tine（小）→ 小小的","A tiny seed can grow into a big tree.","一颗微小的种子可以长成大树。",""],["final","ˈfaɪnəl","adj.","最后的","root","fin（结束）+ al → 最后的。","This is the final exam of the term.","这是本学期最后一次考试。",""],["unclear","ʌnˈklɪə(r)","adj.","不清楚的","root","un-（不）+ clear（清楚的）= 不清楚","The teacher's words were unclear, so the students asked her to repeat them.","老师的话不清楚，学生们请她再说一遍。",""],["quite","kwaɪt","adv.","相当；完全","confuse","和 quiet 一对：quite 是副词“相当”，没有那个“耳朵 e”。","It is quite cold today.","今天相当冷。",""],["useless","ˈjuːsləs","adj.","无用的","root","use（用）+ -less（没有）= 没用的","A map is useless if you cannot find where you are on it.","如果你在地图上找不到自己在哪，地图就没用了。",""],["adapt","əˈdæpt","v.","适应","confuse","和 adopt 只差一个字母：adapt 里是 a，像“调适”的 a；adopt 里是 o，像张开怀抱 → 收养、采用。","Adapt or perish.","要么适应，要么灭亡。","赫伯特·乔治·威尔斯"],["serve","sɜːrv","v.","服务；招待","root","serv-（仆人）→ 像仆人一样服务","The restaurant serves breakfast all day.","这家餐厅全天供应早餐。",""],["soul","soʊl","n.","灵魂","assoc","莎士比亚说：简洁是智慧的灵魂","Brevity is the soul of wit.","简洁是智慧的灵魂。","莎士比亚《哈姆雷特》"],["lose","luːz","v.","丢失；输掉","confuse","和 loose 一对：loose 多一个 o，像裤子松了多出一个圈；lose 是丢东西。","Do not lose your key.","别丢了钥匙。",""],["decide","dɪˈsaɪd","v.","决定","root","de-（下）+ cid（切）→ 一刀切下去 → 决定。","It is hard to decide.","很难下决定。",""],["king","kɪŋ","n.","国王","assoc","联想：king 像‘啃’，国王啃着金苹果发号施令","The king opened the new library with a golden key.","国王用一把金钥匙为新图书馆揭幕。",""],["tone","toʊn","n.","语气；音调","assoc","语气不对，好话也变味","Please don't use that tone with me.","请别用那种语气跟我说话。",""],["blanket","ˈblæŋkɪt","n.","毛毯","assoc","想象：冬夜裹着厚毛毯，窗外下雪，屋里暖和得不想动。","He wrapped himself in a blanket and watched the snow fall outside.","他裹着毛毯，看窗外的雪静静地落。",""],["opinion","əˈpɪnjən","n.","意见；看法","root","词根 opin- 是“认为”，opinion 就是“看法、意见”。","In my opinion, reading is the best way to learn.","在我看来，阅读是最好的学习方式。",""],["quarter","ˈkwɔːrtər","n.","四分之一；季度","root","quart- 是“四分之一”，quarter 就是“一刻钟、一个季度”。","The meeting will start in a quarter of an hour.","会议将在一刻钟后开始。",""],["triangle","ˈtraɪæŋɡl","n.","三角形","root","tri-（三）+ angle（角）→ 三个角 → 三角形。","A triangle has three sides.","三角形有三条边。",""],["fit","fɪt","adj./v.","适合","confuse","fit（适合，尺寸正好）vs suit（适合，款式得体）：侧重点不同。","These shoes fit me well.","这双鞋很合我的脚。",""],["interview","ˈɪntəvjuː","n.","面试；采访","root","inter-（相互）+ view（看）= 互相看，面对面谈话就是面试或采访","She has an interview for her dream job at a car company tomorrow morning.","她明天早上要去一家汽车公司面试她梦寐以求的工作。",""],["address","əˈdres","n./v.","地址；致辞","assoc","想象一封信：信封上的地址是唯一的路标，邮递员按图索骥，把信送到你手里。","Lincoln's Gettysburg Address lasted only two minutes, yet it changed America.","林肯的葛底斯堡演说只有两分钟，却改变了美国。",""],["censor","ˈsensər","v.","审查","confuse","易混 censure（谴责）：censor 是“删改”，censure 是“公开批评”；censor 像剪刀剪掉不让看的，censure 像喇叭喊出来骂人。","The film was censored before it could be shown in cinemas.","这部电影在影院上映前经过了审查删改。",""],["chance","tʃæns","n.","机会","sound","谐音“抢”：机会要靠抢，chance 一出口就像在喊“抢”。","This is your best chance to pass the exam in December.","这是你十二月通过考试的最好机会。",""],["lift","lɪft","v./n.","举起；电梯","assoc","lift 读起来像“力夫特”：用力把东西举起来。","Please help me lift this box onto the table.","请帮我把这个箱子抬到桌子上。",""],["native","ˈneɪtɪv","adj./n.","本地的；本地人","root","nat-（出生）+ -ive：在本地出生的，就是 native。","She is a native of Jingmen.","她是荆门本地人。",""],["leaf","liːf","n.","叶子","assoc","leaf 复数 leaves：秋天一地的落叶，f 变 v 再加 es。","In autumn, the leaves turn red and gold.","秋天，树叶变成红色和金色。",""],["while","waɪl","conj.","当……时；虽然","assoc","while 里的 whi 像指针转了一圈，一段时间过去了——while 是“当……时”。","While I was cooking, he was cleaning the room.","我做饭的时候，他在打扫房间。",""],["farmer","ˈfɑːmə(r)","n.","农民","assoc","联想：farm（农场）+ -er = 农场里的人，农民","The farmer grows rice and vegetables on his land.","这位农民在地里种水稻和蔬菜。",""],["situation","ˌsɪtʃuˈeɪʃən","n.","局势；情况","root","situ-（位置）+ -ation → 所处的位置 → 局势","We need to understand the situation before deciding.","做决定前我们需要了解情况。",""],["difficult","ˈdɪfɪkəlt","adj.","困难的","sound","拆成 diffi-（难）+ cult（膜拜）= 难到要膜拜，difficult","It is difficult to learn a language well without speaking it every day.","不每天开口说，要学好一门语言是很难的。",""],["family","ˈfæməli","n.","家庭","assoc","family 拆成 fa（爸爸）+ mi（妈妈）+ ly（我）：一家人在一起就是 family。","My family is very important to me.","我的家庭对我非常重要。",""],["special","ˈspeʃəl","adj.","特别的","root","speci-（种类）+ -al → 特别的种类 → 特别的","Today is a special day for our class.","今天对我们班来说是个特别的日子。",""],["acquire","əˈkwaɪər","v.","获得；学到","root","ac-（朝向）+ quire（寻求）= 追寻而得→获得。","Children acquire a new language fastest when they hear it every day.","孩子每天听到一门新语言，学得最快。",""],["snake","sneɪk","n.","蛇","assoc","蛇爬行时身体弯成 S 形","The snake hid in the grass.","蛇藏在草丛里。",""],["underground","ˈʌndəɡraʊnd","adj.","地下的","root","under-（在下面）+ ground（地面）= 地面之下的，地下的","The underground car park is under the shopping centre.","地下停车场在购物中心下面。",""],["price","praɪs","n.","价格","confuse","price 是‘价格’，price 里有 ice（冰），价格冷冰冰；别和 prize（奖品）混","The price of anything is the amount of life you exchange for it.","任何东西的价格，都是你为它付出的生命的分量。","Henry David Thoreau"],["when","wen","pron./conj.","什么时候；当……时","sound","谐音“问”：开口问时间，就用 when——when 问的是时间。","When does the train leave?","火车什么时候出发？",""],["unable","ʌnˈeɪbəl","adj.","不能的","root","un-（不）+ able（能够）= 不能够","Without glasses, he was unable to read the small words on the blackboard.","没有眼镜，他看不清黑板上的小字。",""],["kind","kaɪnd","adj./n.","友好的；种类","confuse","kind 一词多义：友好的；种类。kind of 还表示“有点”。","She is a kind girl.","她是个善良的女孩。",""],["scale","skeɪl","n.","规模；刻度","assoc","一杆秤能称出轻重，也能量出规模，scale 两手抓","The company plans to scale up production next year.","公司计划明年扩大生产规模。",""],["nerve","nɜːrv","n.","神经；勇气","assoc","nerve 既是“神经”，也是“勇气”：有勇气的人神经够粗。","It takes nerve to speak in public.","公开演讲需要勇气。",""],["bridge","brɪdʒ","n.","桥","assoc","联想：bridge 连接两岸，人与人之间也需要桥","We build too many walls and not enough bridges.","我们筑了太多的墙，却搭了太少的桥。","Isaac Newton"],["bored","bɔːrd","adj.","厌烦的；无聊的","confuse","bored（感到无聊的人）vs board（木板/黑板）：bored 是 bore（使厌烦）+ -ed，人感到无聊；board 是板子","He felt bored during the long meeting and kept looking at his watch.","漫长的会议让他感到无聊，不停地看表。",""],["once","wʌns","adv.","一次；曾经","root","one（一）+ -ce = once，一次就是 one time。","I have been to Beijing once.","我去过一次北京。",""],["matter","ˈmætər","n./v.","事情；要紧","root","词根 mater- 是“物质”，matter（物质、事情）和 material（材料）同根。","It does not matter if you make a mistake.","犯个错误没关系。",""],["signal","ˈsɪɡnəl","n.","信号","root","sign（标志）+ -al → 传递标志就是信号","The traffic signal turned green.","交通信号灯变绿了。",""],["dead","ded","adj.","死的","confuse","别和 death（死亡）搞混：dead 是形容词（死的），death 是名词（死亡），词尾 d 和 th 决定了词性。","The old phone is dead; it will not turn on again.","这部旧手机坏了，再也开不了机了。",""],["dare","der","v.","敢","sound","谐音“爹”：敢不敢，先问问你爹。","Dare to try, and the worst result is only one more lesson.","敢于尝试，最坏的结果也不过是多上一课。",""],["tour","tʊr","n.","旅行","root","tour ← 拉丁 tornare（转圈）→ 转一圈看看 → 旅行","They took a tour of the old city.","他们游览了老城。",""],["new","nuː","adj.","新的","confuse","new（新的）和 knew（知道的过去式）同音，别写错。","He bought a new bicycle yesterday.","他昨天买了一辆新自行车。",""],["tool","tuːl","n.","工具","assoc","好工具让工作事半功倍","A dictionary is a useful tool for learning English.","词典是学英语的好工具。",""],["desert","ˈdezət","n.","沙漠；v. 抛弃","confuse","和 dessert 一对：dessert 比 desert 多一个 s，像饭后多吃一份甜点。","a desert in Africa","非洲的一片沙漠",""],["meet","meɪt","v.","遇见；见面","confuse","meet（见面）和 meat（肉）同音，见面吃饭都少不了。","Nice to meet you.","很高兴见到你。",""],["thank","θæŋk","v.","感谢","sound","谐音“三克油”→ thank you 就是“三克油”","Thank you for your help.","谢谢你的帮助。",""],["abstract","ˈæbstrækt","adj.","抽象的","root","abs-（离开）+ tract（拉）= 从具体事物中抽出来 → 抽象的。","Love and freedom are abstract ideas, but they change real lives.","爱与自由是抽象的概念，却能改变真实的生活。",""],["replay","ˌriːˈpleɪ","v.","重播","root","re-（再）+ play（播放）= 再播一遍，重播","The match will be replayed on TV tonight.","这场比赛今晚会在电视上重播。",""],["steel","stiːl","n.","钢","confuse","steel 是‘钢铁’，steel 里有 eel（鳗鱼）一样硬邦邦；别和 steal（偷）混","The new bridge is made of steel and can carry heavy trucks.","这座新桥是钢做的，能承载重型卡车。",""],["angel","ˈeɪndʒəl","n.","天使","confuse","易混 angle（角度）：angel 是“天使”，angle 是“角”，发音只差一个音；天使头顶的光环是个圆，没有角。","Fools rush in where angels fear to tread.","傻瓜鲁莽闯入天使亦不敢涉足之地。","Alexander Pope《论批评》"],["overcome","ˌəʊvəˈkʌm","v.","克服；战胜","assoc","over（越过）+ come（来）：越过困难走过来 → 克服。","We shall overcome.","我们终将胜利。","民权运动歌曲《We Shall Overcome》"],["aloud","əˈlaʊd","adv.","大声地","confuse","易混 allowed（被允许的）：aloud 是“出声读”，allowed 是“被允许”，发音相近，拼写只差一个 l；想想“大声（aloud）朗读需要先被允许（allowed）”。","The teacher asked him to read the poem aloud to the class.","老师让他大声把这首诗读给全班听。",""],["fail","feɪl","v.","失败","assoc","fail 里藏着 ail（病痛）：失败的滋味像生病一样难受。","Don't be afraid to fail.","不要害怕失败。",""],["girl","ɡɜːrl","n.","女孩","sound","谐音“格儿”：格格就是 girl（女孩）。","The little girl is very cute.","这个小女孩很可爱。",""],["wood","wʊd","n.","木头；木材；树林","confuse","别和 woods 搞混：wood 是“木头”，woods 是“树林”，加 s 就成了林子。","This table is made of wood.","这张桌子是木头做的。",""],["congress","ˈkɒŋɡres","n.","国会","root","con-（一起）+ gress（走）→ 走到一起开会 → 国会。","The US Congress passed the new law.","美国国会通过了新法律。",""],["mention","ˈmenʃn","v.","提到；提及","assoc","mention 里有 men：男人们聚会时总爱提到足球。","He mentioned the plan in his letter.","他在信中提到了这个计划。",""],["festival","ˈfestɪvəl","n.","节日","root","fest（节日）+ ival → 节日。","The Spring Festival is the most important festival in China.","春节是中国最重要的节日。",""],["rank","ræŋk","n./v.","等级；排名","assoc","rank 读起来像“让客”：排名靠前的要让座给客人。","Our university ranks high in the province.","我们学校在省内排名靠前。",""],["abandon","əˈbændən","v.","放弃；抛弃","root","a-（离开）+ ban（法令）→ 脱离约束 → 抛弃、放弃。","Never abandon your dreams.","永远不要放弃梦想。",""],["network","ˈnetwɜːrk","n.","网络；网状物","root","net（网）+ work（工作）= 互相连通的网络。","The high-speed railway network covers most of China.","高铁网覆盖了中国大部分地区。",""],["value","ˈvæljuː","n.","价值；v. 重视","assoc","想象给每样东西贴上价签，价签上的数字就是它的价值 value。","Reading is of great value to a student.","阅读对学生来说很有价值。",""],["occasion","əˈkeɪʒn","n.","场合；时机","assoc","occasion 里有个 cas：特殊场合总有意外。","On this occasion, we welcome our new teacher.","借此机会，我们欢迎新老师。",""],["boat","boʊt","n.","船；小舟","sound","谐音“抱她”——坐船抱她看夕阳","We took a boat across the lake to reach the old temple.","我们乘船渡过湖去那座古庙。",""],["window","ˈwɪndəʊ","n.","窗户；窗口","root","wind（风）+ -ow：风从哪里进来？窗口——window 就是窗户。","Please open the window, it's too hot here.","请打开窗户，这里太热了。",""],["grass","ɡræs","n.","草","sound","谐音“格拉斯”：格拉斯地上长满了草，grass 就是草。","The grass is green in spring.","春天草地一片绿色。",""],["dishonest","dɪsˈɒnɪst","adj.","不诚实的","root","dis-（不）+ honest（诚实的）= 不诚实，说谎的人","It is dishonest to copy another student's homework and call it your own.","抄别人的作业还说是自己的，是不诚实的行为。",""],["singer","ˈsɪŋə(r)","n.","歌手","assoc","联想：sing（唱歌）+ -er = 唱歌的人，歌手","The young singer became famous after the singing contest.","这位年轻歌手在歌唱比赛后出名了。",""],["appear","əˈpɪə(r)","v.","出现","sound","谐音“阿皮尔”：appear（出现）像阿皮尔突然冒出来","Appearances can be deceiving — the quietest student in class often has the most to say.","外表会骗人——班上最安静的学生往往最有话说。",""],["unlucky","ʌnˈlʌki","adj.","不走运的","root","un-（不）+ lucky（幸运的）= 不走运","He was unlucky to lose his wallet on the first day of the trip.","他真倒霉，旅行的第一天就丢了钱包。",""],["shame","ʃeɪm","n.","羞耻","sound","谐音“伤”→ 羞耻让人心里受伤","What a shame! We missed the last bus.","真遗憾！我们错过了末班车。",""],["excellent","ˈeksələnt","adj.","优秀的","assoc","excellent 里有个 cell（细胞）：优秀得连细胞都在鼓掌。","She did an excellent job.","她的工作完成得非常出色。",""],["select","sɪˈlekt","v.","选择","root","se-（分开）+ lect-（挑）→ 挑出来 → 选择","You can select any three courses this term.","这学期你可以任选三门课。",""],["board","bɔːrd","n.","木板；董事会","confuse","别和 bored（无聊的）搞混：board 和 bored 发音相同，board 是木板或董事会，bored 是感到无聊。","The notice is on the board beside the classroom door.","通知贴在教室门边的布告板上。",""],["moment","ˈmoʊmənt","n.","时刻；瞬间","assoc","moment 里的 men 在等：每一刻都值得珍惜。","Wait a moment, please.","请稍等片刻。",""],["complement","ˈkɑːmplɪmənt","n./v.","补充；补足","confuse","complement（补充）vs compliment（赞美）：complement 里有 complete（完整）——补上才完整；compliment 里有 pli（喜欢）——赞美让人喜欢","Tea and cake complement each other at an afternoon break.","下午茶歇时，茶和蛋糕相得益彰。",""],["top","tɑːp","n.","顶部","assoc","爬到山顶才能看到最好的风景","The view from the top of the hill is amazing.","从山顶看出去的景色美极了。",""],["miss","mɪs","v.","错过；想念","assoc","miss 既是“错过”，也是“想念”：错过了车，也想念着你。","I miss my hometown very much.","我非常想念家乡。",""],["rocket","ˈrɒkɪt","n.","火箭","assoc","联想：rock（岩石）+ et（小）= 小岩石冲上天，火箭点火升空","The rocket carried three astronauts into space early this morning.","火箭今天清晨把三名宇航员送入太空。",""],["task","tæsk","n.","任务","sound","谐音“他死磕”→ 再难的 task 也要死磕到底","Finish this task before you go home.","回家前完成这项任务。",""],["teach","tiːtʃ","v.","教","assoc","富兰克林：告诉我，我会忘记；教我，我会记住","Tell me and I forget. Teach me and I remember. Involve me and I learn.","告诉我，我会忘记；教我，我会记住；让我参与，我会学会。","富兰克林"],["predict","prɪˈdɪkt","v.","预言；预测","root","pre-（提前）+ dict（说）→ 提前说出来 → 预测。","The best way to predict the future is to invent it.","预测未来的最好办法，就是创造未来。","艾伦·凯"],["lake","leɪk","n.","湖","assoc","联想：lake 像‘来客’，湖边总有来客赏景","The lake was so clear that we could see the fish swimming below.","湖水清澈见底，能看到鱼儿在下面游。",""],["biology","baɪˈɑːlədʒi","n.","生物学","root","bio-（生命）+ -logy（学科）→ 研究生命的学科","Biology shows us how forests, animals and humans depend on each other.","生物学告诉我们森林、动物和人类如何相互依存。",""],["layer","ˈleɪər","n.","层；层次","root","lay（放置）+ -er = 一层层放上去的东西，就是“层”。","The cake has three layers of cream.","这个蛋糕有三层奶油。",""],["dye","daɪ","v.","染色","confuse","dye 是‘染色’，dye 里有 ye（耶），染了色耶；别和 die（死）混","She decided to dye her hair red for the new year.","她决定新年把头发染成红色。",""],["care","ker","v./n.","关心；照顾","sound","谐音“开饿”：看到挨饿的人要关心，一“开饿”就想起 care。","Take care of your health before the exam season.","考试季来临前，先照顾好自己的身体。",""],["borrow","ˈbɒrəʊ","v.","借入","sound","谐音“抱老”：borrow（借入）像抱着老书不还","Neither a borrower nor a lender be.","既不要借入，也不要借出。","William Shakespeare"],["share","ʃer","v.","分享；共用","sound","谐音“晒”→ 把好东西晒出来给大家","Please share this article with your classmates.","请把这篇文章分享给你的同学。",""],["town","taʊn","n.","城镇","assoc","小镇生活慢悠悠","She grew up in a small town.","她在一个小镇长大。",""],["awake","əˈweɪk","adj.","醒着的","sound","谐音“啊，我渴”：awake（醒着）的时候，啊，我渴了要喝水","The baby was awake all night, so her mother could not sleep.","宝宝整夜醒着，妈妈也没法睡。",""],["time","taɪm","n.","时间","assoc","富兰克林：记住，时间就是金钱","Remember that time is money.","记住，时间就是金钱。","富兰克林"],["subway","ˈsʌbweɪ","n.","地铁","root","sub-（在下面）+ way（路）= 地下的路，地铁","The subway is the fastest way to cross the city in rush hour.","地铁是高峰期穿过这座城市最快的方式。",""],["slip","slɪp","v.","滑倒；溜走","sound","谐音“丝丽普”→ 地面滑得像丝一样，slip 一跤","Be careful not to slip on the wet floor.","小心别在湿地板上滑倒。",""],["catch","kætʃ","v.","抓住；赶上","sound","谐音“开吃”：抓到鱼就开吃，catch 到的就是你的。","If you leave now, you can still catch the last bus.","你现在走，还赶得上末班车。",""],["tax","tæks","n.","税","sound","谐音“太刻死”→ 税收太刻人","Workers pay tax on their income.","工人要为收入纳税。",""],["cinema","ˈsɪnəmə","n.","电影院","assoc","联想：cine（电影）+ ma = 电影妈妈，cinema 就是电影院","The cinema near our school shows the newest films every Friday.","学校附近的电影院每周五都上映最新影片。",""],["exist","ɪɡˈzɪst","vi.","存在","root","ex-（出）+ sist（站）→ 站出来 → 存在。","Do aliens exist somewhere in the universe?","宇宙中某处存在外星人吗？",""],["operate","ˈɑːpəreɪt","v.","操作；经营","root","oper- 是“工作”，operate 就是“动手操作”。","Can you operate this machine?","你会操作这台机器吗？",""],["deer","dɪər","n.","鹿","confuse","易混 dear（亲爱的）：deer 是“小鹿”，dear 是“亲爱的”，同音不同形；小鹿 deer 在林子里跑，亲爱的人 dear 在心里住。","A deer crossed the road in front of our car at dawn.","黎明时分，一只鹿从我们车前穿过马路。",""],["nervous","ˈnɜːrvəs","adj.","紧张的","root","nerve（神经）+ -ous = 神经过敏的，紧张的。","She felt nervous before the exam.","考试前她感到紧张。",""],["market","ˈmɑːrkɪt","n.","市场","root","mark（标记）+ -et：集市上做标记交易的地方，就是市场。","The night market is full of delicious food.","夜市里满是美食。",""],["introduce","ˌɪntrəˈdjuːs","v.","介绍；引进","root","intro-（向内）+ duce（引导）= 把人领进来，介绍给大家","The teacher asked each student to introduce themselves on the first day of class.","老师让每个学生在开学第一天做自我介绍。",""],["guest","ɡest","n.","客人","confuse","guest（客人）vs host（主人）：一对反义词，客人来了主人招待。","We have guests today.","今天我们家有客人。",""],["hand","hænd","n.","手","assoc","hand 的 'a' 像一张张开的手掌，手就是 hand。","Raise your hand, please.","请举手。",""],["uncle","ˈʌŋkl","n.","叔叔；舅舅","assoc","联想：uncle 像‘盎克’，叔叔盎克爱喝茶","My uncle works as a driver in the city.","我叔叔在城里当司机。",""],["rain","reɪn","n./v.","雨","confuse","rain（雨）、reign（统治）、rein（缰绳）三词同音，雨天别写错。","It rained all day yesterday.","昨天下了一整天的雨。",""],["bottom","ˈbɒtəm","n.","底部","sound","谐音“抱特木”：bottom（底部）像抱着特别的木头沉底","The bottom of the box was full of old photos.","盒子底部装满了旧照片。",""],["slight","slaɪt","adj.","轻微的；纤细的","confuse","slight（轻微）vs light（光/轻）—— slight 专指程度轻微","There was a slight change in the plan.","计划有轻微的变动。",""],["war","wɔː","n.","战争","confuse","别和 warm（温暖的）搞混：war 是“战争”，warm 是“温暖”，战争和温暖是反义词，拼写只差一个 m。","War brings people nothing but pain.","战争带给人们的只有痛苦。",""],["brain","breɪn","n.","大脑","sound","谐音“不累恩”：brain（大脑）不累，恩，越用越灵","The brain is the most complex thing in the known universe.","大脑是已知宇宙中最复杂的东西。",""],["sentence","ˈsentəns","n.","句子；判决","root","sent-（意见）+ -ence → 表达意见的一串词 → 句子；法官的“意见”就是判决","Write five sentences about your hometown.","写五个关于你家乡的句子。",""],["bare","beər","adj.","裸露的；空的","confuse","bare（裸露的）vs bear（熊；忍受）：bare 是 bear 丢了 e，像树丢了叶子，光秃秃的","The trees stood bare in the cold winter wind.","树木在寒冷的冬风中光秃秃地立着。",""],["capital","ˈkæpɪtəl","n.","首都；资本","confuse","别和 capitol（国会大厦）搞混：capital 是首都或资本，capitol 专指美国国会大厦那栋楼。","Beijing is the capital of China.","北京是中国的首都。",""],["blackboard","ˈblækbɔːd","n.","黑板","assoc","black（黑）+ board（板）：黑色的板子 → 黑板。","Write it on the blackboard.","把它写在黑板上。",""],["together","təˈɡeðər","adv.","一起","root","to-（向）+ gether（聚集）→ 聚在一起","Let's study together after class.","下课后我们一起学习吧。",""],["across","əˈkrɔːs","prep.","穿过；横过","assoc","a + cross（十字）：穿过十字路口就是 across。","A high-speed train can take you across three provinces before lunch.","高铁午饭前就能带你穿过三个省。",""],["might","maɪt","aux./n.","可能；力量","confuse","might 是 may 的过去式（可能），mite 是“小虫”，读音相近别混。","It might rain later.","稍后可能会下雨。",""],["monitor","ˈmɑːnɪtər","n./v.","班长；监视","assoc","monitor 既是“班长”，也是“监视器”，都盯着大家。","The teacher monitors the students' progress.","老师关注着学生们的进步。",""],["actual","ˈæktʃuəl","adj.","实际的；真实的","root","act（做/演）+ -ual（……的）→ 做出来的、不是演的 = 实际的","The actual cost was much lower than we expected.","实际花费比我们预想的低得多。",""],["wonderful","ˈwʌndəfəl","adj.","精彩的；极好的","root","wonder（奇迹）+ -ful = 充满奇迹的，精彩的","We had a wonderful time hiking in the mountains during the holiday.","假期我们在山区徒步，玩得非常开心。",""],["coarse","kɔːs","adj.","粗糙的","confuse","coarse 是‘粗糙的’，coarse 比 course 多个 a，像表面多了粗糙的颗粒；别和 course（课程）混","The coarse sand hurt our feet when we walked on the beach.","粗糙的沙子硌得我们脚疼。",""],["hide","haɪd","v.","躲藏","sound","谐音“海底”：躲到海底去，就是 hide（躲藏）。","The cat hides under the bed.","猫藏在床底下。",""],["people","ˈpiːpl","n.","人；人们","root","词根 popul- 是“人民”，people（人们）和 population（人口）同根。","People in this city are very friendly.","这个城市的人非常友好。",""],["language","ˈlæŋɡwɪdʒ","n.","语言","root","词根 lingu- 是“舌头、语言”，language 里藏着 tongue 的影子。","Music is the universal language of mankind.","音乐是全人类共通的语言。","Longfellow"],["per","pər","prep.","每；每一","root","per 本身就是拉丁词根“每、通过”，percent（百分之）里就有它。","The train runs 350 kilometers per hour.","这列火车每小时跑 350 公里。",""],["ticket","ˈtɪkɪt","n.","票；罚单","assoc","抢票回家过年，ticket 就是回家的船票","I bought two tickets for the film.","我买了两张电影票。",""],["eight","eɪt","num.","八","sound","eight 和 ate（吃）同音：我一口气 ate（吃了）eight（八）个饺子。","There are eight people in my family.","我家有八口人。",""],["obvious","ˈɑːbviəs","adj.","明显的","root","ob-（对着）+ vi（路）= 摆在路中间的，明显得很。","It is obvious that he is tired.","很明显他累了。",""],["writer","ˈraɪtə(r)","n.","作家","assoc","联想：write（写）+ -er = 写东西的人，作家","A writer is someone for whom writing is more difficult than it is for other people.","作家就是写作比别人更难的人。","Thomas Mann"],["through","θruː","prep.","通过；穿过","confuse","through（通过）vs threw（throw 的过去式）vs thorough（彻底的）—— through 是穿过去","The train goes through a tunnel.","火车穿过一条隧道。",""],["casual","ˈkæʒuəl","adj.","随意的","confuse","易混 causal（因果的）：casual 是“随便”，causal 是“有因果关系的”；causal 里有 cause（原因）→ 因果，casual 里没有原因，就是随便。","He wore a casual shirt and jeans to the Friday meeting.","周五开会他穿了件休闲衬衫和牛仔裤。",""],["adept","əˈdept","adj.","熟练的；擅长的","confuse","adept（熟练的）vs adapt（适应）vs adopt（收养/采用）：adept 里藏着 dept（部门），部门里的老手都很熟练","She is adept at solving problems under pressure.","她擅长在压力下解决问题。",""],["elder","ˈeldər","adj.","年长的","root","eld（老）+ er（更）→ 更老的 → 年长的。","Respect your elders.","要尊敬长辈。",""],["afraid","əˈfreɪd","adj.","害怕的；担心的","sound","谐音“啊，飞的”——吓得快飞起来了","Don't be afraid to ask questions in class.","上课不要害怕提问。",""],["main","meɪn","adj.","主要的","confuse","main（主要的）和 mane（鬃毛）同音，主次要分清。","The main purpose of this trip is to visit the Great Wall.","这次旅行主要目的是参观长城。",""],["shelter","ˈʃeltər","n.","庇护所","root","shel-（盾，保护）+ -ter → 挡风遮雨的地方","The hikers found shelter in a cave during the storm.","徒步者在暴风雨中找到了一个山洞避难。",""],["heavy","ˈhevi","adj.","重的","assoc","heavy 的 'v' 像被压弯的腰，重得直不起身。","The box is too heavy for me.","这个箱子对我来说太重了。",""],["mirror","ˈmɪrər","n.","镜子","assoc","mirror 读起来像“米罗”：镜子里的人对你微笑。","She looked at herself in the mirror.","她照了照镜子。",""],["sick","sɪk","adj.","生病的","confuse","sick（生病）vs thick（厚的）—— sick 是身体不适，thick 是厚度","He felt sick after the long bus ride.","长途坐车后他觉得恶心。",""],["alarm","əˈlɑːrm","n.","闹钟；警报","sound","谐音“啊，懒猫”——闹钟一响，懒猫也得起床。","She set three alarms and still almost missed her train.","她设了三个闹钟，差点还是没赶上火车。",""],["farm","fɑːrm","n.","农场","assoc","farm 里有个 arm（手臂）：农民用手臂种地，农场就是 farm。","They live on a farm.","他们住在农场里。",""],["target","ˈtɑːrɡɪt","n.","目标；靶子","assoc","射箭要瞄准靶心，学习也要瞄准目标","Our target is to pass the exam in June.","我们的目标是六月通过考试。",""],["thunder","ˈθʌndə(r)","n.","雷；雷声","assoc","联想：thunder 轰隆隆，闪电 tle（很少，不可数）：few 后面跟可数名词。","Few students were late today.","今天很少有学生迟到。",""],["smart","smɑːrt","adj.","聪明的；时髦的","root","smart 原指“刺痛”，脑子“灵”得像被刺一下","She found a smart way to solve the problem.","她找到了一个巧妙的办法解决问题。",""],["code","koʊd","n.","代码；密码","sound","谐音“抠的”——代码是程序员一个字母一个字母抠出来的。","A single wrong code can shut down the whole payment system.","一行写错的代码，就能让整个支付系统瘫痪。",""],["pace","peɪs","n./v.","步伐；速度","root","词根 pac- 是“走”，pace（步伐）就是一步一步走。","He walked at a slow pace.","他步伐缓慢地走着。",""],["smoke","smoʊk","n./v.","烟；吸烟","assoc","烟囱冒 smoke，吸烟有害健康","Smoke from the fire filled the room.","火产生的烟充满了房间。",""],["shape","ʃeɪp","n.","形状","assoc","橡皮泥捏 shape，想捏圆就圆，想捏方就方","Regular exercise helps shape a healthy body.","规律锻炼有助于塑造健康的身体。",""],["else","els","adv.","其他；否则","assoc","or else（否则）——不照做的话，就没有 else（别的）选择了。","What else do you need?","你还需要别的什么吗？",""],["grow","ɡroʊ","v.","生长","sound","谐音“格罗”：格罗小苗破土而出，grow 就是生长。","Plants grow fast in spring.","植物在春天长得很快。",""],["manage","ˈmænɪdʒ","v.","管理；设法","root","man-（手）+ age：用手管事，就是“管理”；manage to do 是“设法做到”。","She manages a team of ten people.","她管理着一个十人团队。",""],["born","bɔːrn","adj.","出生的；天生的","assoc","联想出生第一声啼哭：born 是 bear（生育）的过去分词","He was born in a small village, but his dreams were bigger than the mountains.","他出生在一个小村庄，但梦想比山还大。",""],["ascent","əˈsent","n.","上升；登高","confuse","易混 assent（同意）：ascent 是“往上爬”，assent 是“点头同意”；ascent 里有 cent（台阶），assent 是把同意“送（sent）”出去。","The ascent to the top of the mountain took them six hours.","登上山顶花了他们六个小时。",""],["terrible","ˈterəbəl","adj.","糟糕的；可怕的","root","terr-（害怕）+ -ible → 让人害怕的 → 可怕的","The weather was terrible yesterday.","昨天的天气糟透了。",""],["news","nuːz","n.","新闻；消息","assoc","news 来自四个方向的首字母：North、East、West、South，四面八方的消息。","Have you heard the news?","你听说了吗？",""],["case","keɪs","n.","情况；箱子","sound","谐音“开斯”——箱子开斯，里面装着行李","In this case, we need more time to check the data.","在这种情况下，我们需要更多时间核查数据。",""],["island","ˈaɪlənd","n.","岛","assoc","联想：island 像‘爱兰的’，岛上长满兰花","No man is an island, entire of itself.","没有人是一座孤岛，可以自 了严重损失。",""],["machine","məˈʃiːn","n.","机器","sound","谐音“没心”：机器没心，只会埋头干活。","The machine can print 10,000 pages every hour.","这台机器每小时能印一万页。",""],["between","bɪˈtwiːn","prep.","在……之间","sound","谐音“比推因”：between（在……之间）被推到两人之间","The river runs between the two villages.","这条河从两个村庄之间流过。",""],["everyone","ˈevriwʌn","pron.","每人；人人","root","every（每）+ one（一人）= 每个人","Everyone in the class passed the listening test.","班上每个人都通过了听力测试。",""],["beyond","bɪˈjɑːnd","prep.","超出","assoc","be + yond（那边）：目光越过那一边 → 超出。","Her courage went beyond what anyone expected.","她的勇气超出了所有人的预期。",""],["develop","dɪˈveləp","v.","发展；开发","sound","谐音“低微落魄”：从低微落魄发展到成功，就是 develop","China has developed high-speed rail into one of the fastest networks in the world.","中国已把高铁发展成世界上最快的铁路网之一。",""],["button","ˈbʌtn","n.","纽扣；按钮","assoc","想象：衬衫掉了一颗纽扣，风从洞口灌进来，凉飕飕的。","Press the red button and the doors of the high-speed train will open.","按下红色按钮，高铁车门就会打开。",""],["rebuild","ˌriːˈbɪld","v.","重建","root","re-（再）+ build（建造）= 倒了再建，重建","After the earthquake, the villagers worked together to rebuild their homes.","地震之后，村民们一起重建家园。",""],["able","ˈeɪbəl","adj.","能够","sound","谐音“爱博”：爱博学的人，什么都能够。","She is able to finish the reading in twenty minutes.","她二十分钟就能读完这篇文章。",""],["essential","ɪˈsenʃəl","adj.","必要的；本质的","root","ess（本质）+ ential → 本质的 → 必要的。","Water is essential to life.","水对生命至关重要。",""],["until","ənˈtɪl","prep./conj.","直到……为止","root","拆成 un + til，til 接近 till（直到），合起来就是“直到……为止”。","Wait here until I come back.","在这儿等着，直到我回来。",""],["average","ˈævərɪdʒ","n./adj.","平均数；平均的","assoc","想象：把全班分数加起来除以人数，中间冒出来的那个数就是 average。","The average temperature in Jingmen in November is about 13 degrees.","荆门十一月的平均气温大约是 13 度。",""],["silk","sɪlk","n.","丝绸","assoc","丝绸之路把中国的 silk 带向世界","The dress is made of pure silk.","这件裙子是纯丝绸做的。",""],["homework","ˈhəʊmwɜːk","n.","家庭作业","assoc","home（家）+ work（活儿）：带回家做的活儿 → 家庭作业。","Have you done your homework?","你做完作业了吗？",""],["dessert","dɪˈzɜːt","n.","甜点","confuse","和 desert 一对：dessert 多一个 s，记住“多一个 s 就多一份甜点”。","a delicious dessert","一道美味的甜点",""],["sorrow","ˈsɑːroʊ","n.","悲伤","confuse","sorrow（悲伤，名词）vs sorry（抱歉，形容词）—— sorrow 是心里的悲伤，sorry 是说出口的歉意","Time can heal sorrow, but not erase memories.","时间可以治愈悲伤，却抹不掉记忆。",""],["distance","ˈdɪstəns","n.","距离","root","dis-（分开）+ stance（站）→ 站得远远分开 = 距离","The distance from the school to the station is about two kilometres.","从学校到车站的距离大约两公里。",""],["patience","ˈpeɪʃns","n.","耐心","root","pati-（忍受）+ -ence：能忍耐的品质就是 patience。","Learning a language takes patience.","学一门语言需要耐心。",""],["gift","ɡɪft","n.","礼物","assoc","gift 的 'g' 像礼物盒上的蝴蝶结，礼物就是 gift。","This is a gift for you.","这是给你的礼物。",""],["arrive","əˈraɪv","v.","到达","sound","谐音“饿来福”：饿着肚子来到幸福的地方，终于到达了","The train from Beijing will arrive at the station in ten minutes.","从北京来的火车十分钟后到达车站。",""],["their","ðeə(r)","pron.","他们的","confuse","their 是‘他们的’，their 里有 heir（继承人），继承人是他们家的；别和 there（那里）混","The students put their books on the desks before the class began.","上课前，学生们把他们的书放在桌上。",""],["seat","siːt","n.","座位","confuse","seat（座位）vs sit（坐下）—— seat 是名词“座”，sit 是动作“坐”","Please take your seat before the show begins.","演出开始前请就座。",""],["separate","ˈsepəreɪt","v.","分开","root","se-（分开）+ par-（分）→ 把东西分开","Please separate the clean clothes from the dirty ones.","请把干净衣服和脏衣服分开。",""],["with","wɪð","prep.","和……一起；用","root","with 里的 th 像两个人并肩站在一起——with 就是“和……一起”。","I went to the park with my friends.","我和朋友们一起去了公园。",""],["ever","ˈevər","adv.","曾经；永远","confuse","ever（曾经）vs never（从不）：never 多了一个 n，是否定。","Have you ever been to Beijing?","你去过北京吗？",""],["open","ˈoʊpən","v./adj.","打开；开着的","assoc","open 读起来像“哦喷”：门一开，风就喷进来。","Please open the window.","请打开窗户。",""],["ability","əˈbɪləti","n.","能力","root","able（能）+ -ity（名词后缀）= 能力；能干才有能力。","With daily practice, your ability to remember words grows fast.","每天练习，你记单词的能力会快速增长。",""],["group","ɡruːp","n.","群体","sound","谐音“古鲁普”：古鲁普人围成一圈，group 就是群体。","We work in groups.","我们分组工作。",""],["autumn","ˈɔːtəm","n.","秋天","sound","谐音“哦，腾”：autumn（秋天）一到，哦，落叶腾空飞","In autumn, farmers harvest rice in the golden fields.","秋天，农民在金色的田野里收割稻谷。",""],["danger","ˈdeɪndʒər","n.","危险","assoc","danger 里藏着 anger（愤怒）：遇到危险，人会又怕又怒。","Do not swim in this river; the current is a real danger.","别在这条河里游泳，水流真的很危险。",""],["observe","əbˈzɜːrv","v.","观察；遵守","root","ob-（对着）+ serve（服务）= 对着看，就是“观察”。","Scientists observe the stars every night.","科学家每晚观察星星。",""],["maintain","meɪnˈteɪn","v.","维持；保养","root","main（手）+ tain（拿住）= 用手拿住不放，就是“维持”。","We should maintain a healthy diet and exercise every day.","我们应该保持健康饮食并每天锻炼。",""],["test","test","n./v.","考试；测试","assoc","四级考试就是一场 test","We have an English test tomorrow.","我们明天有一场英语考试。",""],["sunset","ˈsʌnset","n.","日落","assoc","sun（太阳）+ set（落下）：太阳落下 → 日落。","a beautiful sunset","美丽的日落",""],["wet","wet","adj.","湿的","assoc","wet 只有三个字母，像三滴水——wet 就是湿的。","Don't go out in wet shoes.","别穿着湿鞋出门。",""],["either","ˈiːðər","pron./adj.","两者之一","confuse","either（两者之一）vs neither（两者都不）：n 是否定，either 没有 n 就是肯定的那个。","Either book is OK for me.","哪本书对我来说都可以。",""],["sample","ˈsæmpəl","n.","样品；样本","assoc","商场免费试吃就是 sample，先尝一小样再买","You can try a free sample of the new drink.","你可以免费品尝新饮料的样品。",""],["focus","ˈfoʊkəs","n./v.","集中；焦点","root","foc（火）+ us → 像火一样聚在一起 → 焦点；集中。","Focus on your study.","专心学习。",""],["uncomfortable","ʌnˈkʌmftəbəl","adj.","不舒服的；不安的","root","un-（不）+ comfortable（舒服的）= 浑身不自在","The new shoes made her feet uncomfortable after only an hour of walking.","新鞋只穿了一个小时就让她的脚很不舒服。",""],["gas","ɡæs","n.","气体；汽油","confuse","gas（汽油，美式）vs petrol（汽油，英式）：美国人说 gas，英国人说 petrol。","The car needs gas.","这辆车需要加油。",""],["behave","bɪˈheɪv","v.","表现；举止","assoc","be + have（有）：你的表现就是你“有”的样子。","Children behave better when they understand the reason, not just the rule.","孩子明白道理后，表现会比只听规则时更好。",""],["guess","ɡes","v./n.","猜测","sound","谐音“盖斯”：盖斯挠着头猜，guess 就是猜测。","Guess what I bought yesterday.","猜猜我昨天买了什么。",""],["active","ˈæktɪv","adj.","积极的；活跃的","root","act（行动）+ -ive（……的）= 爱行动的 → 积极的。","She takes an active part in class discussions.","她积极参与课堂讨论。",""],["bill","bɪl","n.","账单；法案","sound","谐音“比哦”：账 "wheel 里的 ee 像两个轮子并排转，wh 是车轴——合起来就是轮子。","The car has four wheels.","这辆车有四个轮子。",""],["end","end","n./v.","结束","confuse","end（结束）vs ending（结局）：end 是动作本身，ending 是故事最后的那一段。","The story came to an end.","故事结束了。",""],["queen","kwiːn","n.","女王；王后","assoc","queen 里的 ee 像王冠上的两颗宝石。","The Queen visited China in 1986.","女王于 1986 年访问了中国。",""],["level","ˈlevəl","n./adj.","水平；平的","assoc","level 正反读都一样（回文词），像水平仪一样“平”。","His English level improved a lot this year.","他的英语水平今年提高了很多。",""],["coin","kɔɪn","n.","硬币","sound","谐音“扩音”——硬币掉在地上，响得像开了扩音。","He paid the bus fare with a handful of coins.","他用一把硬币付了公交车费。",""],["journey","ˈdʒɜːrni","n.","旅程","root","journ（日子）+ ey → 一天的行程 → 旅程。","Life is a journey.","人生是一场旅程。",""],["official","əˈfɪʃl","adj.","官方的；正式的","root","office（官方）+ -ial = official，官方的。","This is an official announcement.","这是一则官方公告。",""],["son","sʌn","n.","儿子","confuse","son（儿子）vs sun（太阳）—— s-o-n 是人，s-u-n 是天上的","Her son is a student at our school.","她的儿子是我们学校的学生。",""],["short","ʃɔːrt","adj.","短的；矮的","confuse","short（短的）vs shirt（衬衫）—— short 讲长短，shirt 是穿的","Life is too short to waste on regrets.","人生苦短，别浪费在后悔上。",""],["talk","tɔːk","v.","谈话","assoc","脱口秀就是 talk show，边谈边笑的节目","Let's talk about the plan after lunch.","我们午饭后谈谈这个计划。",""],["accomplish","əˈkʌmplɪʃ","v.","完成；实现","root","ac-（朝向）+ com-（完全）+ pl-（填满）= 彻底填满→完成。","He who would accomplish little must sacrifice little; he who would achieve much must sacrifice much.","想成小事者，须舍小；想成大事者，须舍大。","James Allen《像一个人所想的那样》"],["pain","peɪn","n.","疼痛；痛苦","assoc","谚语：没有付出，就没有收获。","No pain, no gain.","没有付出，就没有收获。","英语谚语"],["toothbrush","ˈtuːθbrʌʃ","n.","牙刷","assoc","tooth（牙齿）+ brush（刷子）：刷牙的刷子 → 牙刷。","a new toothbrush","一把新牙刷",""],["many","ˈmeni","adj.","许多的","sound","谐音“买你”：东西多到“买你”都买不完。","Many students take the CET-4 exam every year.","每年都有很多学生参加四级考试。",""],["lead","liːd","v.","领导；引导","confuse","lead 读 /liːd/ 是“领导”，读 /led/ 是“铅”；过去式 led 也读 /led/，别读错。","A good teacher leads students to think, not just to memorize.","好老师引导学生思考，而不只是背诵。",""],["diet","ˈdaɪət","n./v.","饮食；节食","confuse","diet（节食）vs die（死）：diet 比 die 多了个 t——过度节食真的会 die","A healthy diet has more vegetables and less fried food.","健康的饮食是多吃蔬菜、少吃油炸食品。",""],["adopt","əˈdɒpt","v.","收养；采用","confuse","和 adapt 一对：adopt 的 o 像张开的怀抱 → 抱养孩子；也作“采用（方法）”。","They adopted a baby.","他们收养了一个婴儿。",""],["except","ɪkˈsept","prep.","除了","confuse","和 accept 一对：except = ex-（外）+ cept（拿）→ 拿出去 → 除了。","Everyone except him came.","除了他，大家都来了。",""],["disappear","ˌdɪsəˈpɪə(r)","v.","消失","root","dis-（离开）+ appear（出现）= 出现反了，就是消失；魔术师一挥手，兔子就 disappear 了","The old cinema disappeared from the street when the new shopping mall opened.","新商场开业后，老电影院就从这条街上消失了。",""],["chair","tʃeər","n.","椅子","assoc","联想一把椅子、一本书、一下午","Please pull up a chair and join us for dinner.","请拉把椅子过来，和我们一起吃晚饭。",""],["appreciate","əˈpriːʃieɪt","v.","欣赏；感激","root","ap-（朝向）+ preci-（价格）= 给出价值→欣赏、感激。","We appreciate your patience while the new metro line is under construction.","新地铁线施工期间，感谢您的耐心。",""],["enemy","ˈenəmi","n.","敌人","root","en-（不）+ emy（朋友）→ 不是朋友 → 敌人。","Know your enemy and know yourself.","知己知彼。",""],["less","les","adj./adv.","更少的","confuse","less 修饰不可数名词（less water），fewer 修饰可数名词（fewer people）。","We should use less plastic in daily life.","日常生活中我们应该少用塑料。",""],["message","ˈmesɪdʒ","n.","消息；信息","assoc","message = mess（传递）+ age：传来的消息。","I left a message for you on WeChat.","我在微信上给你留了言。",""],["one","wʌn","num.","一","confuse","one（一）和 won（赢的过去式）同音，考试得第一就是 one and won。","One world, one dream.","同一个世界，同一个梦想。","北京奥运会"],["waterfall","ˈwɔːtəfɔːl","n.","瀑布","assoc","water（水）+ fall（落下）：水落下来 → 瀑布。","a high waterfall","一道高高的瀑布",""],["couple","ˈkʌpl","n.","一对；夫妻","sound","谐音“靠谱”——这对夫妻真靠谱，结婚三十年没红过脸。","The old couple walks along the river every morning at six.","这对老夫妻每天早上六点沿河散步。",""]];
const START=new Date(2026,10,18); const EXAM_DAY=25; const PER_DAY=40;
const REVIEW_UI_ENABLED=false;
const $=s=>document.querySelector(s);
const dayMs=864e5;
function shanghaiToday(){const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());const g=t=>+p.find(x=>x.type===t).value;return new Date(g("year"),g("month")-1,g("day"));}
function todayIdx(){return Math.floor((shanghaiToday()-START)/dayMs);}
function clampedDay(){const total=Math.ceil(WORDS.length/PER_DAY);return Math.max(0,Math.min(todayIdx(),total-1));}
function examLeft(){return Math.ceil((new Date(2026,11,12)-shanghaiToday())/dayMs);}
let mastered=new Set(JSON.parse(localStorage.getItem("cet4-mastered-v1")||"[]"));
let learned={}; try{learned=JSON.parse(localStorage.getItem("cet4-learned-v2")||"{}");}catch(e){learned={};}
function saveMastered(){localStorage.setItem("cet4-mastered-v1",JSON.stringify([...mastered]));updateStats();}
function saveLearned(){localStorage.setItem("cet4-learned-v2",JSON.stringify(learned));}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
const TYPE_ZH={root:"词根",sound:"谐音",assoc:"联想",confuse:"易混"};
let view={day:clampedDay(),query:"",type:"all",unmastered:false};
function dayWords(d){return WORDS.slice(d*PER_DAY,d*PER_DAY+PER_DAY);}
function markLearned(list){const t=shanghaiToday().toDateString();let ch=false;list.forEach(w=>{if(!learned[w[0]]){learned[w[0]]=t;ch=true;}});if(ch)saveLearned();}
function updateStats(){
  const list=dayWords(Math.max(0,Math.min(view.day,Math.ceil(WORDS.length/PER_DAY)-1)));
  const done=list.filter(w=>mastered.has(w[0])).length;
  const di=clampedDay()+1, left=examLeft();
  $("#dayLine").textContent="第 "+di+" 天 · "+shanghaiToday().toLocaleDateString("zh-CN",{month:"long",day:"numeric",weekday:"short"})+(left>0?" · 距笔试还有 "+left+" 天":left===0?" · 今天考试":"");
  $("#progBar").style.width=(list.length?done/list.length*100:0)+"%";
  $("#progLine").textContent="今日 "+list.length+" 词 · 已掌握 "+done+" / "+list.length;
}
function filtered(){
  let list=view.day<0?WORDS.slice():dayWords(view.day);
  if(view.type!=="all")list=list.filter(w=>w[4]===view.type);
  if(view.unmastered)list=list.filter(w=>!mastered.has(w[0]));
  if(view.query){const q=view.query.toLowerCase();list=(view.day<0?WORDS:WORDS).filter(w=>w[0].includes(q)||w[3].includes(q));}
  return list;
}
function renderChips(){
  const defs=[["all","全部"],["root","词根"],["sound","谐音"],["assoc","联想"],["confuse","易混"]];
  $("#chips").innerHTML=defs.map(d=>`<button class="chip${view.type===d[0]?" active":""}" data-t="${d[0]}">${d[1]}</button>`).join("")
    +`<button class="chip ghost${view.unmastered?" active":""}" id="unmBtn">只看未掌握</button>`;
  document.querySelectorAll("#chips .chip[data-t]").forEach(b=>b.addEventListener("click",()=>{view.type=b.dataset.t;renderChips();renderGrid();}));
  $("#unmBtn").addEventListener("click",()=>{view.unmastered=!view.unmastered;renderChips();renderGrid();});
}
function renderDaySel(){
  const sel=$("#daySel");const total=Math.ceil(WORDS.length/PER_DAY);const ti=clampedDay();
  let h=`<option value="${ti}">今天 · 第 ${ti+1} 天</option>`;
  for(let d=0;d<total;d++){if(d!==ti)h+=`<option value="${d}"${d+1===EXAM_DAY?"":""}>第 ${d+1} 天${d+1===EXAM_DAY?" · 考试":""}</option>`;}
  h+=`<option value="-1">全部词库</option>`;
  sel.innerHTML=h;sel.value=String(view.day);
  sel.addEventListener("change",()=>{view.day=parseInt(sel.value,10);updateStats();renderGrid();});
}
let audioEl=null;
function speakFallback(word){
  if(!("speechSynthesis" in window))return;
  try{speechSynthesis.cancel();}catch(e){}
  const u=new SpeechSynthesisUtterance(word);u.lang="en-US";u.rate=.9;
  const v=speechSynthesis.getVoices().find(v=>/en[-_]US/i.test(v.lang));if(v)u.voice=v;
  speechSynthesis.speak(u);
}
function speak(word,btn){
  if(btn){btn.classList.add("playing");setTimeout(()=>btn.classList.remove("playing"),1200);}
  try{
    if(audioEl){audioEl.pause();}
    audioEl=new Audio("https://dict.youdao.com/dictvoice?audio="+encodeURIComponent(word)+"&type=2");
    audioEl.onerror=()=>speakFallback(word);
    const p=audioEl.play(); if(p&&p.catch)p.catch(()=>speakFallback(word));
  }catch(e){speakFallback(word);}
}
if("speechSynthesis" in window){try{speechSynthesis.getVoices();}catch(e){}}
function renderGrid(){
  const list=filtered();
  const g=$("#grid");
  if(!list.length){g.innerHTML=`<div class="empty">没有符合的词</div>`;return;}
  if(view.day>=0&&!view.query&&view.type==="all"&&!view.unmastered)markLearned(list);
  const groups=[];for(let i=0;i<list.length;i+=5)groups.push(list.slice(i,i+5));
  g.innerHTML=groups.map((grp,gi)=>{
    const done=grp.filter(w=>mastered.has(w[0])).length;
    return `<section class="group" data-gi="${gi}" style="animation-delay:${Math.min(gi*60,300)}ms"><h2>第 ${gi+1} 组 <b>${done}/${grp.length}</b></h2><div class="grid">`
    +grp.map(w=>{
      const m=mastered.has(w[0]);
      return `<div class="card${m?" mastered":""}" data-w="${esc(w[0])}"><div class="card-inner">
      <div class="face front"><button class="master${m?" on":""}" aria-label="标记掌握">${m?"✓":""}</button>
      <div class="word">${esc(w[0])}</div>
      <div class="phon">/${esc(w[1])}/ <button class="speak" data-w="${esc(w[0])}">🔊</button></div>
      <div class="mean">${esc(w[2])} ${esc(w[3])}<span class="tag">${TYPE_ZH[w[4]]||w[4]}</span></div>
      <div class="flip-hint">点卡片看巧记</div></div>
      <div class="face back"><div class="trick"><b>巧记</b> ${esc(w[5])}</div>
      <div class="quote">${w[8]?`<span class="q-label">原句 · ${esc(w[8])}</span>`:`<span class="q-label">例句</span>`}<div class="eg">${esc(w[6])}</div><div class="eg-zh">${esc(w[7])}</div></div>
      <div class="flip-hint">点任意处翻回</div></div>
      </div></div>`;
    }).join("")+"</div></section>";
  }).join("");
  g.querySelectorAll(".card").forEach(c=>{
    c.addEventListener("click",e=>{
      if(e.target.closest(".speak"))return;
      if(e.target.closest(".master")){
        const w=c.dataset.w;
        if(mastered.has(w)){mastered.delete(w);}else{mastered.add(w);}
        saveMastered();
        const on=mastered.has(w);
        const btn=c.querySelector(".master");btn.classList.toggle("on",on);btn.textContent=on?"✓":"";
        const grp=c.closest(".group");
        if(grp){const cards=grp.querySelectorAll(".card");let d=0;cards.forEach(x=>{if(mastered.has(x.dataset.w))d++;});grp.querySelector("h2").innerHTML=`第 ${parseInt(grp.dataset.gi,10)+1} 组 <b>${d}/${cards.length}</b>`;}
        return;
      }
      c.classList.toggle("flipped");
    });
  });
  g.querySelectorAll(".speak").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();speak(b.dataset.w,b);}));
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let fcList=[],fcIdx=0,fcFlipped=false;
function fcShow(){
  const w=fcList[fcIdx%fcList.length];if(!w)return;
  $("#fcWord").textContent=w[0];
  $("#fcPhon").textContent="/"+w[1]+"/ · "+w[2];
  $("#fcMean").textContent=fcFlipped?w[3]+" — "+w[5]:"";
}
function fcReset(){fcList=shuffle(dayWords(clampedDay()).slice());fcIdx=0;fcFlipped=false;fcShow();}
$("#fcWord").addEventListener("click",()=>{fcFlipped=!fcFlipped;fcShow();});
$("#fcKnow").addEventListener("click",()=>{const w=fcList[fcIdx%fcList.length];if(w){mastered.add(w[0]);saveMastered();}fcIdx++;fcFlipped=false;fcShow();renderGrid();});
$("#fcDont").addEventListener("click",()=>{fcIdx++;fcFlipped=false;fcShow();});
$("#fcNext").addEventListener("click",()=>{fcIdx++;fcFlipped=false;fcShow();});
$("#fcOpen").addEventListener("click",()=>{const p=$("#fcPanel");p.classList.toggle("open");$("#quizPanel").classList.remove("open");if(p.classList.contains("open"))fcReset();});
function startQuiz(){
  const pool=shuffle(dayWords(clampedDay()).slice());
  const qs=pool.slice(0,10).map(w=>{
    const opts=shuffle([w].concat(shuffle(WORDS.filter(x=>x[0]!==w[0])).slice(0,3))).map(x=>x[3]);
    return {w,opts};
  });
  let qi=0,score=0;
  const body=$("#quizBody");
  function renderQ(){
    if(qi>=qs.length){body.innerHTML=`<p>得分 ${score} / ${qs.length}</p><p class="quiz-meta">再来一次点“小测验”。</p>`;return;}
    const q=qs[qi];
    body.innerHTML=`<p>第 ${qi+1} / ${qs.length} 题 · <b>${esc(q.w[0])}</b> 是什么意思？</p>`
      +q.opts.map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join("")
      +`<div class="quiz-meta">得分 ${score}</div>`;
    body.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
      const ok=b.dataset.o===q.w[3];
      if(ok)score++;
      body.querySelectorAll(".opt").forEach(x=>{
        if(x.dataset.o===q.w[3])x.classList.add("right");
        else if(x===b)x.classList.add("wrong");
        x.disabled=true;
      });
      setTimeout(()=>{qi++;renderQ();},900);
    }));
  }
  renderQ();
}
$("#quizOpen").addEventListener("click",()=>{const p=$("#quizPanel");p.classList.toggle("open");$("#fcPanel").classList.remove("open");if(p.classList.contains("open"))startQuiz();});
$("#search").addEventListener("input",e=>{view.query=e.target.value.trim();renderGrid();});
/* ---- review engine (internal only; REVIEW_UI_ENABLED=false, no visible UI) ---- */
function reviewDue(){
  const now=shanghaiToday().getTime();
  const due=Object.keys(learned).filter(w=>{
    if(mastered.has(w))return false;
    const t=new Date(learned[w]).getTime();
    return (now-t)>=2*dayMs;
  });
  return due;
}
function buildReviewSet(n){
  const due=shuffle(reviewDue()).slice(0,n||20);
  return due.map(word=>{
    const w=WORDS.find(x=>x[0]===word);if(!w)return null;
    const kind=Math.random()<.5?"spell":"choice";
    if(kind==="spell")return {kind,word:w[0],prompt:w[3],answer:w[0]};
    const opts=shuffle([w].concat(shuffle(WORDS.filter(x=>x[0]!==w[0])).slice(0,3))).map(x=>x[3]);
    return {kind,word:w[0],prompt:w[0],options:opts,answer:w[3]};
  }).filter(Boolean);
}
function reviewTick(){
  try{
    const due=reviewDue();
    localStorage.setItem("cet4-review-v2",JSON.stringify({date:shanghaiToday().toDateString(),dueCount:due.length,nextReview:due.length?new Date(shanghaiToday().getTime()+2*dayMs).toDateString():null}));
  }catch(e){}
}
window.CET4={reviewDue,buildReviewSet,reviewTick,dayWords};
if(!REVIEW_UI_ENABLED){reviewTick();}
const LINES=[["Extinguish the flame. See what burns beneath. Drop the blade. Let true steel speak.","灭烛见真火，忘剑得神兵。","《影之刃零》"],["I'll be back.","我会回来的。","《终结者》"],["To infinity and beyond!","飞向宇宙，浩瀚无垠！","《玩具总动员》"],["To be, or not to be, that is the question.","生存还是毁灭，这是一个问题。","《哈姆雷特》"],["May the Force be with you.","愿原力与你同在。","《星球大战》"],["I have a dream.","我有一个梦想。","马丁·路德·金"],["Life is like a box of chocolates.","生活就像一盒巧克力。","《阿甘正传》"],["The only thing we have to fear is fear itself.","我们唯一需要恐惧的，就是恐惧本身。","富兰克林·罗斯福"],["That's one small step for man, one giant leap for mankind.","这是个人的一小步，却是人类的一大步。","尼尔·阿姆斯特朗"],["Carpe diem. Seize the day.","活在当下。","《死亡诗社》"]];
function renderDaily(){const l=LINES[((todayIdx()%LINES.length)+LINES.length)%LINES.length];$("#dailyLine").innerHTML=`<div class="d-label">今日一句</div><div class="d-en">${esc(l[0])}</div><div class="d-zh">${esc(l[1])}</div><div class="d-src">—— ${esc(l[2])}</div>`;}
renderDaily();renderDaySel();renderChips();updateStats();renderGrid();
</script>
